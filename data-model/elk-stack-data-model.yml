source: >-
  Derived from the path parameters, $ref graph and schema/definition names in
  openapi/elk-stack-elasticsearch-openapi.json (2,683 schemas),
  openapi/elk-stack-kibana-openapi.yaml and
  openapi/elk-stack-elastic-cloud-swagger.json (516 definitions). Entity
  identifiers were taken from the path parameters Elastic actually uses; the
  counts below are occurrence counts of those parameters across the contract.
note: >-
  The Elastic Stack has three separate object graphs that meet at exactly one
  point. Elasticsearch's graph is data (index → document → field mapping);
  Kibana's graph is application state persisted as saved objects inside a
  space; Elastic Cloud's graph is infrastructure (organization → deployment →
  resource). They join where an Elastic Cloud deployment PROVISIONS an
  Elasticsearch cluster and a Kibana instance — which is why an agent holding
  Cloud credentials still cannot read a document, and one holding cluster
  credentials cannot resize a deployment.
domains:
- domain: Elasticsearch (data plane)
  root: index
  identifier_style: >-
    Caller-chosen strings, not opaque server-generated ids. Index names,
    document _id, job_id, model_id, transform_id and connector_id are all
    supplied or chosen by the client. There are NO type-prefixed identifiers
    anywhere in the Elasticsearch surface — nothing like Stripe's cus_/ch_ —
    so an id carries no clue about what it identifies. An agent must track the
    entity type alongside every id it holds.
  entities:
  - name: index
    id_param: index
    occurrences: 86
    detail: The primary container. Every document, mapping and search is scoped to one or more indices (or an alias/data stream that resolves to them).
  - name: document
    id_param: id
    occurrences: 41
    detail: Addressed as /{index}/_doc/{id}. Carries system fields _index, _id, _seq_no, _primary_term, _version.
  - name: alias
    id_param: name
    detail: A named pointer to one or more indices; the indirection layer that makes reindexing non-disruptive.
  - name: data_stream
    id_param: name
    detail: An append-only abstraction over a series of backing indices, managed by a lifecycle policy.
  - name: index_template / component_template
