- domain: Kibana (application plane)
  root: space
  identifier_style: UUID or caller-supplied slug, scoped by space.
  entities:
  - name: space
    id_param: space_id
    detail: >-
      The outermost tenancy boundary. Almost every Kibana route has a
      space-scoped twin at /s/{space_id}/... — including the MCP endpoint.
      Ignoring it is the most common cause of an agent reading the wrong
      tenant's objects.
  - name: saved_object
    detail: The generic persistence primitive behind dashboards, visualizations, data views, index patterns, tags and more.
  - name: data_view
    detail: Binds a Kibana object graph to an Elasticsearch index pattern — the join point between the two domains.
  - name: dashboard
  - name: rule (alerting) / connector (action) / maintenance-window
  - name: case
  - name: detection_rule
    detail: Carries the MITRE ATT&CK threat mapping described in conformance/elk-stack-conformance.yml.
  - name: fleet_agent / agent_policy / package_policy / enrollment_api_key
  - name: agent_builder_agent / tool / skill / conversation / attachment
    detail: Experimental as of 9.2.0; the surface behind the MCP and A2A endpoints.
