            schema:
              type: object
              properties:
                name:
                  description: 'The name for a runtime field.

                    '
                  type: string
                runtimeField:
                  description: 'The runtime field definition object.

                    '
                  type: object
              required:
              - name
              - runtimeField
        required: true
      responses:
