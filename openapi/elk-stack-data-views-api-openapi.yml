          '
        in: path
        name: viewId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              updateRuntimeFieldRequest:
                $ref: '#/components/examples/Data_views_create_runtime_field_request'
            schema:
              type: object
              properties:
                name:
                  description: 'The name for a runtime field.

                    '
                  type: string
                runtimeField:
                  description: 'The runtime field definition object.

                    '
                  type: object
              required:
              - name
              - runtimeField
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                createUpdateRuntimeFieldResponse:
