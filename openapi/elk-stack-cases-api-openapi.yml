    Cases_template_write_request:
      description: 'The body for creating or fully replacing a case template. Server-managed attributes (author, usage statistics, field summaries, version flags) are computed and cannot be set.


        Resource limits (enforced on write; a violation returns `400`): an owner may have at most 200 templates per space, and a definition may declare at most 200 fields. Version history is intentionally uncapped. A single stored extended-field value may not exceed 30000 UTF-8 bytes. The YAML `definition` string itself may not exceed 30000 characters (enforced on create, update, and `dry_run`).

        '
      properties:
        definition:
          description: 'The template definition as a YAML string: case defaults (name, severity, category, tags, assignees, connector, settings) and a `fields` array of inline field definitions or `$ref` entries pointing into the owner''s field library. Stored field values appear on cases under `extended_fields` keys shaped `<field_name>_as_<storage_type>`.

            '
          example: "name: Security incident\nseverity: high\ntags: [security]\nfields:\n  - name: priority\n    label: Priority\n    type: keyword\n    control: SELECT_BASIC\n    metadata:\n      options: [low, medium, high]\n      default: medium\n  - $ref: risk_score\n"
          maxLength: 30000
          type: string
        description:
          description: A description of the template.
          maxLength: 1000
          type: string
        isEnabled:
          default: true
          description: Disabled templates are hidden from the case creation flow.
          type: boolean
        name:
          description: 'The template identity name, unique per owner (case-insensitive). May be omitted when the YAML definition provides a case-default title (`name:`), which is then used as the identity name.

            '
          maxLength: 50
          minLength: 1
          type: string
        owner:
          $ref: '#/components/schemas/Cases_owner'
        tags:
          $ref: '#/components/schemas/Cases_template_tags'
      required:
      - owner
      - definition
      title: Template write request
      type: object
