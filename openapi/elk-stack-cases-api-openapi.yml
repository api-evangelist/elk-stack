    Cases_applicable_fields_response:
      description: 'The fields a caller may apply to a case''s `extended_fields`. When no template is in scope, this is the owner''s global (library-wide) fields; when a template is applied, it also includes that template''s fields. Migrated legacy custom fields appear here as `global` fields, so existing automations can look up the exact key to write.

        '
      type: object
      properties:
        fields:
          items:
            type: object
            properties:
              control:
                description: 'The UI control for the field, such as `INPUT_TEXT`, `INPUT_NUMBER`, `SELECT_BASIC`, `TOGGLE`, or `MARKDOWN`.

                  '
                example: SELECT_BASIC
                type: string
              defaultValue:
                description: The default value, as a string, when the field definition declares one.
                type: string
              displayOnly:
                description: 'When `true` the field is display-only (for example a `MARKDOWN` block): it is returned so the full form shape is visible, but it holds no value and its `key` cannot be written to `extended_fields`.

                  '
                type: boolean
              isGlobal:
                description: Whether the field is a global (library-wide) definition.
                type: boolean
              key:
                description: 'The storage key to write in the case `extended_fields` map. Follows the `<field_name>_as_<storage_type>` convention (for example `priority_as_keyword`).

                  '
                example: priority_as_keyword
                type: string
              label:
                description: The human-readable label. Falls back to `name` when no label is authored.
                example: Priority
                type: string
              name:
                description: The field name as authored in the field definition.
                example: priority
                type: string
              options:
                description: The allowed values for `SELECT_BASIC`, `RADIO_GROUP`, and `CHECKBOX_GROUP` fields.
                items:
                  type: string
                type: array
              type:
                description: 'The storage type: `keyword`, `integer`, `long`, `boolean`, or `date`.'
                example: keyword
                type: string
              required:
                description: Whether a value must be supplied at write time.
                type: boolean
              requiredOnClose:
                description: Whether the field must be filled before the case can be closed.
                type: boolean
              source:
                description: 'Where the field comes from: `global` for a library-wide (`isGlobal`) definition writable on any case, or `template` for a field contributed by the applied template.

                  '
                enum:
                - global
                - template
                type: string
            required:
            - key
            - name
            - label
            - type
            - control
            - required
            - requiredOnClose
            - displayOnly
            - source
            - isGlobal
          type: array
      required:
      - fields
