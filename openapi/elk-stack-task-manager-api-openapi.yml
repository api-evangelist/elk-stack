openapi: 3.2.0
info:
  contact:
    name: Kibana Team
  description: 'The Kibana REST APIs enable you to manage resources such as connectors, data views, and saved objects.

    The API calls are stateless.

    Each request that you make happens in isolation from other calls and must include all of the necessary information for Kibana to fulfill the

    request.

    API requests return JSON output, which is a format that is machine-readable and works well for automation.


    To interact with Kibana APIs, use the following operations:


    - GET: Fetches the information.

    - PATCH: Applies partial modifications to the existing information.

    - POST: Adds new information.

    - PUT: Updates the existing information.

    - DELETE: Removes the information.


    You can prepend any Kibana API endpoint with `kbn:` and run the request in **Dev Tools → Console**.

    For example:


    ```

    GET kbn:/api/data_views

    ```


    For more information about the console, refer to [Run API requests](https://www.elastic.co/docs/explore-analyze/query-filter/tools/console).


    NOTE: Access to internal Kibana API endpoints will be restricted in Kibana version 9.0. Please move any integrations to publicly documented APIs.


    ## Documentation source and versions


    This documentation is derived from the `main` branch of the [kibana](https://github.com/elastic/kibana) repository.

    It is provided under license [Attribution-NonCommercial-NoDerivatives 4.0 International](https://creativecommons.org/licenses/by-nc-nd/4.0/).


    This documentation contains work-in-progress information for future Elastic Stack releases.

    '
  title: Kibana task manager API
  version: ''
  x-doc-license:
    name: Attribution-NonCommercial-NoDerivatives 4.0 International
    url: https://creativecommons.org/licenses/by-nc-nd/4.0/
  x-feedbackLink:
    label: Feedback
    url: https://github.com/elastic/docs-content/issues/new?assignees=&labels=feedback%2Ccommunity&projects=&template=api-feedback.yaml&title=%5BFeedback%5D%3A+
servers:
- url: https://{kibana_url}
  variables:
    kibana_url:
      default: localhost:5601
security:
- apiKeyAuth: []
- basicAuth: []
tags:
- description: Task manager APIs enable you to check the health of the Kibana task manager, which is used by features such as alerting, actions, and reporting to run mission critical work as persistent background tasks.
  externalDocs:
    description: Task manager
    url: https://www.elastic.co/docs/deploy-manage/distributed-architecture/kibana-tasks-management
  name: task manager
  x-displayName: Task manager
paths:
  /api/task_manager/_health:
    get:
      description: 'Get the health status of the Kibana task manager.

        '
      operationId: task-manager-health
      responses:
        '200':
          content:
            application/json:
              examples:
                taskManagerHealthResponse1:
                  $ref: '#/components/examples/Task_manager_health_APIs_health_200response'
              schema:
                $ref: '#/components/schemas/Task_manager_health_APIs_health_response'
          description: Indicates a successful call
      summary: Get the task manager health
      tags:
      - task manager
      x-metaTags:
      - content: Kibana
        name: product_name
components:
  schemas:
    Task_manager_health_APIs_health_response:
      title: Task health response properties
      type: object
      properties:
        id:
          type: string
        last_update:
          type: string
        stats:
          type: object
          properties:
            capacity_estimation:
              description: 'This object provides a rough estimate about the sufficiency of its capacity. These are estimates based on historical data and should not be used as predictions.

                '
              type: object
            configuration:
              $ref: '#/components/schemas/Task_manager_health_APIs_configuration'
            runtime:
              description: 'This object tracks runtime performance of Task Manager, tracking task drift, worker load, and stats broken down by type, including duration and run results.

                '
              type: object
            workload:
              $ref: '#/components/schemas/Task_manager_health_APIs_workload'
        status:
          type: string
        timestamp:
          type: string
    Task_manager_health_APIs_workload:
      description: 'This object summarizes the work load across the cluster, including the tasks in the system, their types, and current status.

        '
      type: object
    Task_manager_health_APIs_configuration:
      description: 'This object summarizes the current configuration of Task Manager. This includes dynamic configurations that change over time, such as `poll_interval` and `max_workers`, which can adjust in reaction to changing load on the system.

        '
      type: object
