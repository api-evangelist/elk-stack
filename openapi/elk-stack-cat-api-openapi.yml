          description: 'The total number of fields in all the documents that have been processed by the anomaly detection job.

            Only fields that are specified in the detector configuration object contribute to this count.

            The timestamp is not included in this count.'
          type: string
        data.input_bytes:
          description: The number of bytes of input data posted to the anomaly detection job.
          allOf:
          - $ref: '#/components/schemas/_types.ByteSize'
        data.input_records:
          description: The number of input documents posted to the anomaly detection job.
          type: string
        data.input_fields:
          description: 'The total number of fields in input documents posted to the anomaly detection job.

            This count includes fields that are not used in the analysis.

            However, be aware that if you are using a datafeed, it extracts only the required fields from the documents it retrieves before posting them to the job.'
          type: string
        data.invalid_dates:
          description: The number of input documents with either a missing date field or a date that could not be parsed.
          type: string
        data.missing_fields:
          description: 'The number of input documents that are missing a field that the anomaly detection job is configured to analyze.

            Input documents with missing fields are still processed because it is possible that not all fields are missing.

            If you are using datafeeds or posting data to the job in JSON format, a high `missing_field_count` is often not an indication of data issues.

            It is not necessarily a cause for concern.'
          type: string
        data.out_of_order_timestamps:
          description: 'The number of input documents that have a timestamp chronologically preceding the start of the current anomaly detection bucket offset by the latency window.

            This information is applicable only when you provide data to the anomaly detection job by using the post data API.

            These out of order documents are discarded, since jobs require time series data to be in ascending chronological order.'
          type: string
        data.empty_buckets:
          description: 'The number of buckets which did not contain any data.

            If your data contains many empty buckets, consider increasing your `bucket_span` or using functions that are tolerant to gaps in data such as mean, `non_null_sum` or `non_zero_count`.'
          type: string
        data.sparse_buckets:
          description: 'The number of buckets that contained few data points compared to the expected number of data points.

            If your data contains many sparse buckets, consider using a longer `bucket_span`.'
          type: string
        data.buckets:
          description: The total number of buckets processed.
          type: string
        data.earliest_record:
          description: The timestamp of the earliest chronologically input document.
          type: string
        data.latest_record:
          description: The timestamp of the latest chronologically input document.
          type: string
        data.last:
          description: The timestamp at which data was last analyzed, according to server time.
          type: string
        data.last_empty_bucket:
          description: The timestamp of the last bucket that did not contain any data.
          type: string
        data.last_sparse_bucket:
          description: The timestamp of the last bucket that was considered sparse.
          type: string
        model.bytes:
          description: 'The number of bytes of memory used by the models.

            This is the maximum value since the last time the model was persisted.

            If the job is closed, this value indicates the latest size.'
          allOf:
          - $ref: '#/components/schemas/_types.ByteSize'
        model.memory_status:
          description: The status of the mathematical models.
          allOf:
          - $ref: '#/components/schemas/ml._types.MemoryStatus'
        model.bytes_exceeded:
          description: The number of bytes over the high limit for memory usage at the last allocation failure.
          allOf:
          - $ref: '#/components/schemas/_types.ByteSize'
        model.memory_limit:
          description: The upper limit for model memory usage, checked on increasing values.
          type: string
        model.by_fields:
          description: 'The number of `by` field values that were analyzed by the models.

            This value is cumulative for all detectors in the job.'
          type: string
        model.over_fields:
          description: 'The number of `over` field values that were analyzed by the models.

            This value is cumulative for all detectors in the job.'
          type: string
        model.partition_fields:
          description: 'The number of `partition` field values that were analyzed by the models.

            This value is cumulative for all detectors in the job.'
          type: string
        model.bucket_allocation_failures:
          description: 'The number of buckets for which new entities in incoming data were not processed due to insufficient model memory.

            This situation is also signified by a `hard_limit: memory_status` property value.'
          type: string
        model.categorization_status:
          description: The status of categorization for the job.
          allOf:
          - $ref: '#/components/schemas/ml._types.CategorizationStatus'
        model.categorized_doc_count:
          description: The number of documents that have had a field categorized.
          type: string
        model.total_category_count:
          description: The number of categories created by categorization.
          type: string
        model.frequent_category_count:
          description: The number of categories that match more than 1% of categorized documents.
          type: string
        model.rare_category_count:
          description: The number of categories that match just one categorized document.
          type: string
        model.dead_category_count:
          description: 'The number of categories created by categorization that will never be assigned again because another category’s definition makes it a superset of the dead category.

            Dead categories are a side effect of the way categorization has no prior training.'
          type: string
        model.failed_category_count:
          description: 'The number of times that categorization wanted to create a new category but couldn’t because the job had hit its `model_memory_limit`.

            This count does not track which specific categories failed to be created.

            Therefore you cannot use this value to determine the number of unique categories that were missed.'
          type: string
        model.log_time:
          description: The timestamp when the model stats were gathered, according to server time.
          type: string
        model.timestamp:
          description: The timestamp of the last record when the model stats were gathered.
          type: string
        forecasts.total:
          description: 'The number of individual forecasts currently available for the job.

            A value of one or more indicates that forecasts exist.'
