    cat.allocation.AllocationRecord:
      type: object
      properties:
        shards:
          description: Number of primary and replica shards assigned to the node.
          type: string
        shards.undesired:
          description: Amount of shards that are scheduled to be moved elsewhere in the cluster or -1 other than desired balance allocator is used
          oneOf:
          - type: string
          - type:
            - string
            - 'null'
        write_load.forecast:
          description: Sum of index write load forecasts
          oneOf:
          - $ref: '#/components/schemas/_spec_utils.Stringifieddouble'
          - type:
            - string
            - 'null'
        disk.indices.forecast:
          description: Sum of shard size forecasts
          oneOf:
          - $ref: '#/components/schemas/_types.ByteSize'
          - type:
            - string
            - 'null'
        disk.indices:
          description: 'Disk space used by the node’s shards. Does not include disk space for the translog or unassigned shards.

            IMPORTANT: This metric double-counts disk space for hard-linked files, such as those created when shrinking, splitting, or cloning an index.'
          oneOf:
          - $ref: '#/components/schemas/_types.ByteSize'
          - type:
            - string
            - 'null'
        disk.used:
          description: 'Total disk space in use.

            Elasticsearch retrieves this metric from the node’s operating system (OS).

            The metric includes disk space for: Elasticsearch, including the translog and unassigned shards; the node’s operating system; any other applications or files on the node.

            Unlike `disk.indices`, this metric does not double-count disk space for hard-linked files.'
          oneOf:
          - $ref: '#/components/schemas/_types.ByteSize'
          - type:
            - string
            - 'null'
        disk.avail:
          description: 'Free disk space available to Elasticsearch.

            Elasticsearch retrieves this metric from the node’s operating system.

            Disk-based shard allocation uses this metric to assign shards to nodes based on available disk space.'
          oneOf:
          - $ref: '#/components/schemas/_types.ByteSize'
          - type:
            - string
            - 'null'
        disk.total:
          description: Total disk space for the node, including in-use and available space.
          oneOf:
          - $ref: '#/components/schemas/_types.ByteSize'
          - type:
            - string
            - 'null'
        disk.percent:
          description: Total percentage of disk space in use. Calculated as `disk.used / disk.total`.
          oneOf:
          - $ref: '#/components/schemas/_types.Percentage'
          - type:
            - string
            - 'null'
        host:
          description: Network host for the node. Set using the `network.host` setting.
          oneOf:
          - $ref: '#/components/schemas/_types.Host'
          - type:
            - string
            - 'null'
        ip:
          description: IP address and port for the node.
          oneOf:
          - $ref: '#/components/schemas/_types.Ip'
          - type:
            - string
            - 'null'
        node:
          description: Name for the node. Set using the `node.name` setting.
          type: string
        node.role:
          description: Node roles
          oneOf:
          - type: string
          - type:
            - string
            - 'null'
