      type: object
      properties:
        index:
          description: The index name.
          allOf:
          - $ref: '#/components/schemas/_types.IndexName'
        shard:
          description: The shard name.
          type: string
        prirep:
          description: 'The shard type: `primary` or `replica`.'
          type: string
        ip:
          description: The IP address of the node where it lives.
          type: string
        id:
          description: The unique identifier of the node where it lives.
          allOf:
          - $ref: '#/components/schemas/_types.NodeId'
        segment:
          description: The segment name, which is derived from the segment generation and used internally to create file names in the directory of the shard.
          type: string
        generation:
          description: 'The segment generation number.

            Elasticsearch increments this generation number for each segment written then uses this number to derive the segment name.'
          type: string
        docs.count:
          description: 'The number of documents in the segment.

            This excludes deleted documents and counts any nested documents separately from their parents.

            It also excludes documents which were indexed recently and do not yet belong to a segment.'
          type: string
        docs.deleted:
          description: 'The number of deleted documents in the segment, which might be higher or lower than the number of delete operations you have performed.

            This number excludes deletes that were performed recently and do not yet belong to a segment.

            Deleted documents are cleaned up by the automatic merge process if it makes sense to do so.

            Also, Elasticsearch creates extra deleted documents to internally track the recent history of operations on a shard.'
          type: string
        size:
          description: The segment size in bytes.
          allOf:
          - $ref: '#/components/schemas/_types.ByteSize'
        size.memory:
          description: 'The segment memory in bytes.

            A value of `-1` indicates Elasticsearch was unable to compute this number.'
          allOf:
          - $ref: '#/components/schemas/_types.ByteSize'
        committed:
          description: 'If `true`, the segment is synced to disk.

            Segments that are synced can survive a hard reboot.

            If `false`, the data from uncommitted segments is also stored in the transaction log so that Elasticsearch is able to replay changes on the next start.'
          type: string
        searchable:
          description: 'If `true`, the segment is searchable.

            If `false`, the segment has most likely been written to disk but needs a refresh to be searchable.'
          type: string
        version:
          description: The version of Lucene used to write the segment.
          allOf:
          - $ref: '#/components/schemas/_types.VersionString'
        compound:
          description: 'If `true`, the segment is stored in a compound file.

            This means Lucene merged all files from the segment in a single file to save file descriptors.'
          type: string
