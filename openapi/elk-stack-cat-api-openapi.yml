    cat.recovery-200:
      description: ''
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/cat.recovery.RecoveryRecord'
          examples:
            CatRecoveryResponseExample1:
              summary: No ongoing recoveries
              description: 'A successful response from `GET _cat/recovery?v=true&format=json`. In this example, the source and target nodes are the same because the recovery type is `store`, meaning they were read from local storage on node start.

                '
              value: "[\n  {\n    \"index\": \"my-index-000001 \",\n    \"shard\": \"0\",\n    \"time\": \"13ms\",\n    \"type\": \"store\",\n    \"stage\": \"done\",\n    \"source_host\": \"n/a\",\n    \"source_node\": \"n/a\",\n    \"target_host\": \"127.0.0.1\",\n    \"target_node\": \"node-0\",\n    \"repository\": \"n/a\",\n    \"snapshot\": \"n/a\",\n    \"files\": \"0\",\n    \"files_recovered\": \"0\",\n    \"files_percent\": \"100.0%\",\n    \"files_total\": \"13\",\n    \"bytes\": \"0b\",\n    \"bytes_recovered\": \"0b\",\n    \"bytes_percent\": \"100.0%\",\n    \"bytes_total\": \"9928b\",\n    \"translog_ops\": \"0\",\n    \"translog_ops_recovered\": \"0\",\n    \"translog_ops_percent\": \"100.0%\"\n  }\n]"
            CatRecoveryResponseExample2:
              summary: A live shard recovery
              description: 'A successful response from `GET _cat/recovery?v=true&h=i,s,t,ty,st,shost,thost,f,fp,b,bp&format=json`. You can retrieve information about an ongoing recovery for example when you increase the replica count of an index and bring another node online to host the replicas. In this example, the recovery type is `peer`, meaning the shard recovered from another node. The `files` and `bytes` are real-time measurements.

                '
              value: "[\n  {\n    \"i\": \"my-index-000001\",\n    \"s\": \"0\",\n    \"t\": \"1252ms\",\n    \"ty\": \"peer\",\n    \"st\": \"done\",\n    \"shost\": \"192.168.1.1\",\n    \"thost\": \"192.168.1.1\",\n    \"f\": \"0\",\n    \"fp\": \"100.0%\",\n    \"b\": \"0b\",\n    \"bp\": \"100.0%\",\n  }\n]"
            CatRecoveryResponseExample3:
              summary: A snapshot recovery
