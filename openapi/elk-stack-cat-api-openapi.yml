        id:
          description: The unique identifier for the snapshot.
          type: string
        repository:
          description: The repository name.
          type: string
        status:
          description: 'The state of the snapshot process.

            Returned values include:

            `FAILED`: The snapshot process failed.

            `INCOMPATIBLE`: The snapshot process is incompatible with the current cluster version.

            `IN_PROGRESS`: The snapshot process started but has not completed.

            `PARTIAL`: The snapshot process completed with a partial success.

            `SUCCESS`: The snapshot process completed with a full success.'
          type: string
        start_epoch:
          description: The Unix epoch time (seconds since 1970-01-01 00:00:00) at which the snapshot process started.
          allOf:
          - $ref: '#/components/schemas/_spec_utils.StringifiedEpochTimeUnitSeconds'
        start_time:
          description: The time (HH:MM:SS) at which the snapshot process started.
          allOf:
          - $ref: '#/components/schemas/watcher._types.ScheduleTimeOfDay'
        end_epoch:
          description: The Unix epoch time (seconds since 1970-01-01 00:00:00) at which the snapshot process ended.
          allOf:
          - $ref: '#/components/schemas/_spec_utils.StringifiedEpochTimeUnitSeconds'
        end_time:
          description: The time (HH:MM:SS) at which the snapshot process ended.
          allOf:
          - $ref: '#/components/schemas/_types.TimeOfDay'
        duration:
          description: The time it took the snapshot process to complete, in time units.
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        indices:
          description: The number of indices in the snapshot.
          type: string
        successful_shards:
          description: The number of successful shards in the snapshot.
          type: string
        failed_shards:
          description: The number of failed shards in the snapshot.
          type: string
        total_shards:
          description: The total number of shards in the snapshot.
          type: string
