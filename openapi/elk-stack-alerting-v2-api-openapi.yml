          - string
          - 'null'
        description:
          description: A description of the action policy.
          type: string
        destinations:
          description: The list of destinations.
          items:
            $ref: '#/components/schemas/Kibana_HTTP_APIs_alerting_action_policy_destination'
          type: array
        enabled:
          description: Whether the action policy is enabled.
          type: boolean
        group_by:
          description: The fields used to group alerts, or null for no grouping.
          items:
            type: string
          type:
          - array
          - 'null'
        grouping_mode:
          allOf:
          - $ref: '#/components/schemas/Kibana_HTTP_APIs_alerting_action_policy_grouping_mode'
          description: The grouping mode for alert notifications.
        id:
          description: The unique identifier for the action policy.
          type: string
        matcher:
          description: A KQL query to match alerts, or null to match all.
          type:
          - string
          - 'null'
        name:
          description: The name of the action policy.
          type: string
        snoozed_until:
          description: The ISO datetime until which the policy is snoozed, or null if not snoozed.
          type:
          - string
          - 'null'
        tags:
          description: Tags associated with the action policy.
          items:
            type: string
          type:
          - array
          - 'null'
        throttle:
          additionalProperties: false
          description: The throttle configuration for notifications.
          type:
          - object
          - 'null'
          properties:
            interval:
              description: The throttle interval duration (e.g. 5m, 1h), or null when the strategy is intervalless.
              type:
              - string
              - 'null'
            strategy:
              anyOf:
              - description: notify only on episode status transitions (default for `per_episode`).
                enum:
                - on_status_change
                type: string
              - description: notify on transitions and at regular intervals.
                enum:
                - per_status_interval
                type: string
              - description: notify at regular intervals regardless of status (default for `all`/`per_field`).
                enum:
                - time_interval
                type: string
              - description: notify on every evaluation cycle (high volume).
                enum:
                - every_time
