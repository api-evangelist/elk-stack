          - interval
        updated_at:
          description: The ISO datetime when the action policy was last updated.
          type: string
        updated_by:
          description: The user ID who last updated the action policy.
          type:
          - string
          - 'null'
        version:
          description: The version, used for optimistic concurrency control.
          type: string
