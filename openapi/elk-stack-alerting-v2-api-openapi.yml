components:
  schemas:
    Kibana_HTTP_APIs_alerting_alert_action:
      description: 'Request body for creating a single alert action. One of: ack, unack, assign, tag, snooze, unsnooze, activate, deactivate.'
      discriminator:
        mapping:
          ack: '#/components/schemas/Kibana_HTTP_APIs_alerting_ack_alert_action'
          activate: '#/components/schemas/Kibana_HTTP_APIs_alerting_activate_alert_action'
          assign: '#/components/schemas/Kibana_HTTP_APIs_alerting_assign_alert_action'
          deactivate: '#/components/schemas/Kibana_HTTP_APIs_alerting_deactivate_alert_action'
          snooze: '#/components/schemas/Kibana_HTTP_APIs_alerting_snooze_alert_action'
          tag: '#/components/schemas/Kibana_HTTP_APIs_alerting_tag_alert_action'
          unack: '#/components/schemas/Kibana_HTTP_APIs_alerting_unack_alert_action'
          unsnooze: '#/components/schemas/Kibana_HTTP_APIs_alerting_unsnooze_alert_action'
        propertyName: action_type
      oneOf:
      - $ref: '#/components/schemas/Kibana_HTTP_APIs_alerting_ack_alert_action'
      - $ref: '#/components/schemas/Kibana_HTTP_APIs_alerting_unack_alert_action'
      - $ref: '#/components/schemas/Kibana_HTTP_APIs_alerting_assign_alert_action'
      - $ref: '#/components/schemas/Kibana_HTTP_APIs_alerting_tag_alert_action'
      - $ref: '#/components/schemas/Kibana_HTTP_APIs_alerting_snooze_alert_action'
      - $ref: '#/components/schemas/Kibana_HTTP_APIs_alerting_unsnooze_alert_action'
      - $ref: '#/components/schemas/Kibana_HTTP_APIs_alerting_activate_alert_action'
      - $ref: '#/components/schemas/Kibana_HTTP_APIs_alerting_deactivate_alert_action'
    Kibana_HTTP_APIs_alerting_match_action_policies_for_rule_request:
      additionalProperties: false
      type: object
      properties:
        rule:
          additionalProperties: false
          type: object
          properties:
            id:
              description: The ID of the rule.
              maxLength: 256
              minLength: 1
              type: string
            name:
              description: The name of the rule, used to evaluate global matcher expressions.
              maxLength: 256
              minLength: 1
              type: string
            tags:
              description: The tags of the rule, used to evaluate global matcher expressions.
              items:
                maxLength: 256
                minLength: 1
                type: string
              maxItems: 100
              type: array
    Kibana_HTTP_APIs_alerting_action_policy_throttle:
      additionalProperties: false
      type: object
      properties:
        interval:
          description: The throttle interval duration (e.g. 5m, 1h), or null when the strategy is intervalless.
          type:
          - string
          - 'null'
        strategy:
          anyOf:
          - description: notify only on episode status transitions (default for `per_episode`).
            enum:
            - on_status_change
            type: string
          - description: notify on transitions and at regular intervals.
            enum:
            - per_status_interval
            type: string
          - description: notify at regular intervals regardless of status (default for `all`/`per_field`).
            enum:
            - time_interval
            type: string
          - description: notify on every evaluation cycle (high volume).
            enum:
            - every_time
            type: string
          description: The throttle strategy.
    Kibana_HTTP_APIs_alerting_action_policy_grouping_mode:
      anyOf:
      - description: one notification per alert episode lifecycle (default).
        enum:
        - per_episode
        type: string
      - description: a single notification for all matching episodes.
        enum:
        - all
        type: string
      - description: group by specified `groupBy` fields.
        enum:
        - per_field
        type: string
      description: 'The grouping mode: per_episode groups by episode lifecycle, all sends a single notification for all alerts, per_field groups by the specified fields.'
    Kibana_HTTP_APIs_alerting_unsnooze_alert_action:
      additionalProperties: false
      type: object
      properties:
        action_type:
          description: Removes snooze from an alert.
          enum:
          - unsnooze
          type: string
      required:
      - action_type
    Kibana_HTTP_APIs_alerting_bulk_dry_run_response:
      additionalProperties: false
      description: Dry-run preview returned by a by-query bulk endpoint when `force` is false.
      type: object
      properties:
        match_count:
          description: 'Total number of resources matching the query. A dry run never fails on size, but if this exceeds 10000, re-sending the same query with `force: true` is rejected with `BULK_QUERY_MATCH_LIMIT_EXCEEDED`; narrow the query before executing.'
          maximum: 9007199254740991
          minimum: 0
          type: integer
        sample:
          description: Sample of matching resource IDs (up to 100) for spot-checking before executing.
          items:
            type: string
          maxItems: 100
          type: array
      required:
      - match_count
      - sample
    Kibana_HTTP_APIs_alerting_update_action_policy:
      additionalProperties: false
      type: object
      properties:
        description:
          description: A description of the action policy.
          maxLength: 1024
          type: string
        destinations:
          description: The list of destinations. At least one is required.
          items:
            $ref: '#/components/schemas/Kibana_HTTP_APIs_alerting_action_policy_destination'
          maxItems: 10
          minItems: 1
          type: array
        group_by:
          description: The fields used to group alerts.
          items:
            maxLength: 256
            minLength: 1
            type: string
          maxItems: 16
          type:
          - array
          - 'null'
        grouping_mode:
          allOf:
          - $ref: '#/components/schemas/Kibana_HTTP_APIs_alerting_action_policy_grouping_mode'
          description: The grouping mode for alert notifications.
        matcher:
          description: A KQL query string to match alerts.
          maxLength: 4096
          type:
          - string
          - 'null'
        name:
          description: The name of the action policy.
          maxLength: 256
          minLength: 1
          type: string
        tags:
          description: Tags for categorizing the action policy.
          items:
            maxLength: 128
            minLength: 1
            type: string
          maxItems: 20
          type:
          - array
          - 'null'
        throttle:
          allOf:
          - $ref: '#/components/schemas/Kibana_HTTP_APIs_alerting_action_policy_throttle'
          description: The throttle configuration for notifications.
        version:
          description: The current version of the action policy, used for optimistic concurrency control.
          maxLength: 256
          minLength: 1
          type: string
      required:
      - version
    Kibana_HTTP_APIs_alerting_rule_response:
      additionalProperties: false
      type: object
      properties:
        artifacts:
          description: Artifacts attached to the rule, each shaped as `{ id, type, data }`. `data` is a type-specific object (for example a `runbook` may carry `content`, a `dashboard` may carry `dashboardId`). Per-type shape is validated by the artifact-type registry when the type is registered; unregistered types pass through with envelope bounds only.
          items:
            $ref: '#/components/schemas/Kibana_HTTP_APIs_alerting_rule_artifact'
          maxItems: 100
          type: array
        created_at:
          description: ISO timestamp when the rule was created.
          type: string
        created_by:
          description: User who created the rule.
          type:
          - string
          - 'null'
        enabled:
          description: Whether the rule is enabled.
          type: boolean
        grouping:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_alerting_rule_grouping'
        id:
          description: Unique rule identifier.
          type: string
        kind:
          anyOf:
          - description: Default. Tracks each problem as an alert episode and its lifecycle, link it to workflows to notify your team. Use when the user wants to detect and respond.
            enum:
            - alert
            type: string
          - description: Matches are stored as queryable events. No alerts, no notifications - just data. Use when the user wants to collect evidence.
            enum:
            - signal
            type: string
          description: The kind of the rule.
        metadata:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_alerting_rule_response_metadata'
        no_data_strategy:
          anyOf:
          - description: Holds the last known episode status when no data is present.
            enum:
            - last_known_status
            type: string
          - description: Emits a `no_data` alert event when no_data query returns no rows for the group. "emit" is not currently accepted by the create/update API.
            enum:
            - emit
            type: string
          - description: Resolves the alert episode to inactive on the first no-data run.
            enum:
            - recover
            type: string
          - description: No-data situations are ignored (default).
            enum:
            - none
            type: string
          description: How to handle no-data situations. "last_known_status" holds the last known status; "recover" forces recovery; "none" disables no-data detection. "emit" is not currently accepted by the create/update API. Standalone-format rules must provide a `no_data` query block when this is not "none"; composed-format rules use `base` as the data-presence query.
        query:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_alerting_rule_query'
        recovery_strategy:
          anyOf:
          - description: recovers groups that stop breaching (default).
            enum:
            - no_breach
            type: string
          - description: uses a custom recovery query to detect recovery.
            enum:
            - query
            type: string
          - description: disables recovery entirely.
            enum:
            - none
            type: string
          description: How recovery is detected. "no_breach" recovers groups that stop breaching; "query" uses a custom recovery query; "none" disables recovery.
        schedule:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_alerting_rule_schedule'
        state_transition:
          additionalProperties: false
          description: Episode state transition thresholds (alert-only).
          type:
          - object
          - 'null'
          properties:
            pending_count:
              description: Consecutive breaches before transitioning to active.
              maximum: 1000
              minimum: 0
              type: integer
            pending_operator:
              description: How to combine count and timeframe for pending.
              enum:
              - AND
              - OR
