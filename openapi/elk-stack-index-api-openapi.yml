openapi: 3.2.0
info:
  title: Elk Stack Index API
  version: 1.0.0
  contact:
    name: Elastic
    url: https://www.elastic.co
  description: 'Operations tagged Index across 2 of this provider''s published API definitions: elk-stack-openapi.yml, elk-stack-index-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://localhost:9200
  description: Default local Elasticsearch endpoint
- url: https://{host}:{port}
  description: Self-hosted or Elastic Cloud cluster endpoint
  variables:
    host:
      default: localhost
    port:
      default: '9200'
security:
- basicAuth: []
- apiKeyAuth: []
tags:
- name: Index
paths:
  /{index}:
    put:
      summary: Create index
      operationId: createIndex
      tags:
      - Index
      parameters:
      - $ref: '#/components/parameters/IndexName'
      responses:
        '200':
          description: Index created
    delete:
      summary: Delete index
      operationId: deleteIndex
      tags:
      - Index
      parameters:
      - $ref: '#/components/parameters/IndexName'
      responses:
        '200':
          description: Index deleted
    servers:
    - url: http://localhost:9200
      description: Default local Elasticsearch endpoint
    - url: https://{host}:{port}
      description: Self-hosted or Elastic Cloud cluster endpoint
      variables:
        host:
          default: localhost
        port:
          default: '9200'
  /{index}/_mapping:
    get:
      summary: Get index mappings
      operationId: getIndexMapping
      tags:
      - Index
      parameters:
      - $ref: '#/components/parameters/IndexName'
      responses:
        '200':
          description: Index mappings
    servers:
    - url: http://localhost:9200
      description: Default local Elasticsearch endpoint
    - url: https://{host}:{port}
      description: Self-hosted or Elastic Cloud cluster endpoint
      variables:
        host:
          default: localhost
        port:
          default: '9200'
  /{index}/_settings:
    put:
      summary: Update index settings
      operationId: updateIndexSettings
      tags:
      - Index
      parameters:
      - $ref: '#/components/parameters/IndexName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Settings updated
    servers:
    - url: http://localhost:9200
      description: Default local Elasticsearch endpoint
    - url: https://{host}:{port}
      description: Self-hosted or Elastic Cloud cluster endpoint
      variables:
        host:
          default: localhost
        port:
          default: '9200'
components:
  parameters:
    IndexName:
      name: index
      in: path
      required: true
      schema:
        type: string
      description: Index name
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: ApiKey <base64-encoded-id:api_key>
x-refined-from:
- elk-stack-openapi.yml
- elk-stack-index-api-openapi.yml
x-elastic:
  curl:
    auth: '-H "Authorization: ApiKey $ECE_API_KEY"'
