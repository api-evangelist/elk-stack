                  - linux
                  tags:
                  - malware
                  type: simple
              type: object
              properties:
                items:
                  items:
                    $ref: '#/components/schemas/Security_Exceptions_API_CreateRuleExceptionListItemProps'
                  type: array
              required:
              - items
        description: Rule exception items.
        required: true
      responses:
