                      type: exists
                    - field: host.name
                      operator: included
                      type: match_any
                      value:
                      - saturn
                      - jupiter
                    item_id: simple_list_item
                    list_id: simple_list
                    name: Sample Exception List Item
                    namespace_type: single
                    os_types:
                    - linux
                    tags:
                    - malware
                    type: simple
            schema:
              example:
                items:
                - description: This is a sample detection type exception item.
                  entries:
                  - field: actingProcess.file.signer
                    operator: excluded
                    type: exists
                  - field: host.name
