      - public_hostname
      - state
      properties:
        name:
          type: string
          description: Name of this coordinator candidate.
        public_hostname:
          type: string
          description: Public hostname of this coordinator candidate
        acl:
          description: Zookeeper ACL of nodes this coordinator candidate is allowed to read
          $ref: '#/components/schemas/ZkAcl'
        id:
          type: integer
          format: int32
          description: Zookeeper server identifier corresponding to this coordinator candidate
        attributes:
          type: object
          description: Attributes of this coordinator candidate
          additionalProperties:
            type: string
        state:
          type: string
          description: State of the candidate
          enum:
          - accepted
          - pending
      description: Summarized information about a coordinator candidate.
    GrowShrinkStrategyConfig:
      type: object
      description: A strategy that creates instances with the new plan, migrates data from the old instances, then shuts down the old instances. `GrowShrinkStrategyConfig` is safer than 'rolling' and ensures single node availability during a plan change, but can be a lot slower on larger clusters.
    ProxiesFilteredGroupHealth:
      type: object
      required:
