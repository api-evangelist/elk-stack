          items:
            $ref: '#/components/schemas/ProxiesAllocationsInfo'
        filtered_groups:
          type: array
          description: Filtered groups of proxies with associated status
          items:
            $ref: '#/components/schemas/ProxiesFilteredGroupHealth'
        status:
          type: string
          description: '"Health status for all proxies. One of "Green", "Yellow" or "Red"'
    Blessing:
      type: object
      required:
      - value
      properties:
        value:
          type: boolean
          description: Whether something is blessed or not
      description: Whether something is blessed or not
    TransientElasticsearchPlanConfiguration:
      type: object
      properties:
        strategy:
          $ref: '#/components/schemas/PlanStrategy'
        plan_configuration:
          $ref: '#/components/schemas/ElasticsearchPlanControlConfiguration'
        restore_snapshot:
          $ref: '#/components/schemas/RestoreSnapshotConfiguration'
        snapshot_dependency:
          description: Configuration for attaching a snapshot dependency from another cluster
          $ref: '#/components/schemas/SnapshotDependencyConfiguration'
        remote_clusters:
          description: The list of resources that will be configured as remote clusters
          $ref: '#/components/schemas/RemoteResources'
        cluster_settings_json:
          type: object
          description: 'If specified, contains transient settings to be applied to an Elasticsearch cluster during changes,default values shown below applied.

            These can be overridden by specifying them in the map (or null to unset). Additional settings can also be set. Settings will be cleared after the plan has finished. If not specified, no settings will be applied.

            NOTE: These settings are only explicitly cleared for 5.x+ clusters, they must be hand-reset to their defaults in 2.x- (or a cluster reboot will clear them).

            - indices.store.throttle.max_bytes_per_sec: 120Mb

            - indices.recovery.max_bytes_per_sec: 120Mb

            - cluster.routing.allocation.cluster_concurrent_rebalance: 5

            - cluster.routing.allocation.node_initial_primaries_recoveries: 5

            - cluster.routing.allocation.node_concurrent_incoming_recoveries: 5

            For version 8.1 and later no defaults are provided through this mechanism, but instead hardware dependent settings are provided to each instance.'
          properties: {}
      description: Defines the configuration parameters that control how the plan is applied. For example, the Elasticsearch cluster topology and Elasticsearch settings.
    ProxiesSSOSettings:
      type: object
      required:
      - cookie_name
      - default_redirect_path
      - dont_log_requests
      - maintenance_bypass_cookie_name
      - max_age
      - sso_secret
      properties:
        max_age:
          type: integer
          format: int64
          description: Maximum age of single-sign-on token in milliseconds
        sso_secret:
          type: string
          description: Secret string for single-sign-on
        cookie_name:
          type: string
          description: Name of the HTTP cookie used for single-sign-on
        dont_log_requests:
          type: boolean
          description: If true, don't log requests
        default_redirect_path:
          type: string
          description: Default path where users are redirected after a successful single-sign-on
        maintenance_bypass_cookie_name:
          type: string
          description: Name of the cookie that bypasses maintenance
      description: '> WARNING

        > This object is deprecated and scheduled to be removed in the next major version.'
    SimpleQueryStringQuery:
      type: object
      required:
      - query
      properties:
        query:
          type: string
          description: The query expressed in simple query string syntax.
        fields:
          type: array
          description: Array of fields to search
          items:
            type: string
        default_operator:
          type: string
          description: The boolean operator used to combine the terms of the query. Valid values are `OR` (default) and `AND`.
        analyze_wildcard:
          type: boolean
          description: If `true`, the query attempts to analyze wildcard terms. Defaults to `false`.
        analyzer:
          type: string
          description: The name of the analyzer to use to convert the query text into tokens.
        auto_generate_synonyms_phrase_query:
          type: boolean
          description: If `true`, the parse creates a `match_phrase` uery for each multi-position token. Defaults to `true`.
        flags:
          type: string
          description: List of enabled operators for the simple query string syntax. Defaults to `ALL`.
        fuzzy_max_expansions:
          type: integer
          format: int32
          description: Maximum number of terms to which the query expands for fuzzy matching. Defaults to 50.
        fuzzy_prefix_length:
          type: integer
          format: int32
          description: Number of beginning characters left unchanged for fuzzy matching. Defaults to 0.
        fuzzy_transpositions:
          type: boolean
          description: If `true`, edits for fuzzy matching include transpositions of two adjacent characters. Defaults to `false`.
        lenient:
          type: boolean
          description: If `true`, format-based errors, such as providing a text value for a numeric field are ignored. Defaults to `false`.
        minimum_should_match:
          type: string
          description: Minimum number of clauses that must match for a document to be returned.
        quote_field_suffix:
          type: string
          description: Suffix appended to quoted text in the query string.
      description: A query that uses simple query string syntax. Will ignore invalid syntax.
    Blessings:
      type: object
      required:
      - runner_ids_to_blessing
      properties:
        runner_ids_to_blessing:
