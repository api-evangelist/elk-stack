          type: string
          format: date-time
          description: When this plan attempt (ie to apply the plan to the APM) started (ISO format in UTC)
        attempt_end_time:
          type: string
          format: date-time
          description: If this plan completed or failed (ie is not pending), when the attempt ended (ISO format in UTC)
