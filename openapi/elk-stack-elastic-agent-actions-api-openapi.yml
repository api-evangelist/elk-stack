  /api/fleet/agents/action_status:
    get:
      description: '**Spaces method and path for this operation:**


        <div><span class="operation-verb get">get</span>&nbsp;<span class="operation-path">/s/{space_id}/api/fleet/agents/action_status</span></div>


        Refer to [Spaces](https://www.elastic.co/docs/deploy-manage/manage-spaces) for more information.


        Get the current status of recent agent actions.<br/><br/>[Required authorization] Route required privileges: fleet-agents-read.'
      operationId: get-fleet-agents-action-status
      parameters:
      - description: Page number
        in: query
        name: page
        required: false
        schema:
          default: 0
          type: number
      - description: Number of results per page
        in: query
        name: perPage
        required: false
        schema:
          default: 20
          type: number
      - description: Return actions created before this date
        in: query
        name: date
        required: false
        schema:
          type: string
      - description: Return only the latest N actions
        in: query
        name: latest
        required: false
        schema:
          type: number
      - description: Return only actions whose start_time is in the future
        in: query
        name: scheduledOnly
        required: false
        schema:
          type: boolean
      - description: Number of error details to include per action
        in: query
        name: errorSize
        required: false
        schema:
          default: 5
          type: number
      responses:
        '200':
          content:
            application/json:
              examples:
                getActionStatusExample:
                  description: Status of recent agent actions
                  value:
                    items:
                    - actionId: action-id-1
                      completionTime: '2024-01-01T00:05:00.000Z'
                      creationTime: '2024-01-01T00:00:00.000Z'
                      nbAgentsAck: 2
                      nbAgentsActioned: 2
                      nbAgentsFailed: 0
                      status: COMPLETE
                      type: UPGRADE
              schema:
                additionalProperties: false
                type: object
                properties:
                  items:
                    items:
                      additionalProperties: false
                      type: object
                      properties:
                        actionId:
                          type: string
                        cancellationTime:
                          type: string
                        completionTime:
                          type: string
                        creationTime:
                          description: creation time of action
                          type: string
                        expiration:
                          type: string
                        hasRolloutPeriod:
                          type: boolean
                        is_automatic:
                          type: boolean
                        latestErrors:
                          items:
                            additionalProperties: false
                            description: latest errors that happened when the agents executed the action
                            type: object
                            properties:
                              agentId:
                                type: string
                              error:
                                type: string
                              hostname:
                                type: string
                              timestamp:
                                type: string
                            required:
                            - agentId
                            - error
                            - timestamp
                          maxItems: 10
                          type: array
                        nbAgentsAck:
                          description: number of agents that acknowledged the action
                          type: number
                        nbAgentsActionCreated:
                          description: number of agents included in action from kibana
                          type: number
                        nbAgentsActioned:
                          description: number of agents actioned
                          type: number
                        nbAgentsFailed:
                          description: number of agents that failed to execute the action
                          type: number
                        newPolicyId:
                          description: new policy id (POLICY_REASSIGN action)
                          type: string
                        policyId:
                          description: policy id (POLICY_CHANGE action)
                          type: string
                        revision:
                          description: new policy revision (POLICY_CHANGE action)
                          type: number
                        startTime:
                          description: start time of action (scheduled actions)
                          type: string
                        status:
                          enum:
                          - COMPLETE
                          - EXPIRED
                          - CANCELLED
                          - FAILED
                          - IN_PROGRESS
                          - ROLLOUT_PASSED
                          type: string
                        type:
                          enum:
                          - UPGRADE
                          - UNENROLL
                          - SETTINGS
                          - POLICY_REASSIGN
                          - CANCEL
                          - FORCE_UNENROLL
                          - REQUEST_DIAGNOSTICS
                          - UPDATE_TAGS
                          - POLICY_CHANGE
                          - INPUT_ACTION
                          - MIGRATE
                          - PRIVILEGE_LEVEL_CHANGE
                          - ROLLBACK
                          - REMOVE_COLLECTOR
                          type: string
                        version:
                          description: agent version number (UPGRADE action)
                          type: string
                      required:
                      - actionId
                      - nbAgentsActionCreated
                      - nbAgentsAck
                      - nbAgentsFailed
                      - type
                      - nbAgentsActioned
                      - status
                      - creationTime
                    maxItems: 10000
                    type: array
                required:
                - items
          description: Successful response
        '400':
          content:
            application/json:
              examples:
                genericErrorResponseExample:
                  description: Example of a generic error response
                  value:
                    error: Bad Request
                    message: An error message describing what went wrong
                    statusCode: 400
              schema:
                additionalProperties: false
                description: Generic Error
                type: object
                properties:
                  attributes: {}
                  error:
                    type: string
                  errorType:
                    type: string
                  message:
                    type: string
                  statusCode:
                    type: number
                required:
                - message
                - attributes
          description: Bad Request
      summary: Get an agent action status
      tags:
      - Elastic Agent actions
      x-metaTags:
      - content: Kibana
        name: product_name
  /api/fleet/agents/actions/{actionId}/cancel:
