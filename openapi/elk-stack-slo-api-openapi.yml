                    statusCode: 403
              schema:
                $ref: '#/components/schemas/SLOs_403_response'
          description: Forbidden response
      summary: Batch delete rollup and summary data
      tags:
      - slo
      x-metaTags:
      - content: Kibana
        name: product_name
  /s/{spaceId}/api/observability/slos/_bulk_snapshot:
    post:
      description: 'Compute the summary of multiple SLO instances at a given point in time. The endpoint is synchronous and returns results directly. Each result contains either a summary (on success) or a per-instance error. The list of requests is limited to 100 entries. When `instanceId` is omitted or set to `''*''`, the API returns a result for each matching instance (up to 1000 per SLO). You must have the `read` privileges for the **SLOs** feature in the **Observability** section of the Kibana feature privileges.

        '
      operationId: bulkSnapshotOp
      parameters:
      - $ref: '#/components/parameters/SLOs_kbn_xsrf'
      - $ref: '#/components/parameters/SLOs_space_id'
      requestBody:
        content:
          application/json:
            examples:
              bulkSnapshotRequest:
                summary: Compute snapshots for two SLO instances
                value:
                  at: '2025-01-12T10:00:00.000Z'
                  requests:
                  - id: 8853df00-ae2e-11ed-90af-09bb6422b258
                    instanceId: '*'
                  - id: d077e940-1515-11ee-9c50-9d096392f520
                    instanceId: host.name:web-01
            schema:
              $ref: '#/components/schemas/SLOs_bulk_snapshot_request'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                bulkSnapshotResponse:
                  summary: Bulk snapshot response with mixed success and per-instance error
                  value:
                    at: '2025-01-12T10:00:00.000Z'
                    results:
                    - id: 8853df00-ae2e-11ed-90af-09bb6422b258
                      instanceId: '*'
                      summary:
                        errorBudget:
                          consumed: 0.24
                          initial: 0.01
                          remaining: 0.76
                        good: 9976
                        sliValue: 0.9976
                        status: HEALTHY
                        total: 10000
                    - error:
                        message: SLO [d077e940-1515-11ee-9c50-9d096392f520] not found
                        statusCode: 404
                      id: d077e940-1515-11ee-9c50-9d096392f520
                      instanceId: host.name:web-01
              schema:
                $ref: '#/components/schemas/SLOs_snapshot_response'
          description: Successful response
        '400':
          content:
            application/json:
              examples:
                badRequestExample:
                  summary: Bad request
                  value:
                    error: Bad Request
                    message: '`requests` is limited to 100 entries'
                    statusCode: 400
              schema:
                $ref: '#/components/schemas/SLOs_400_response'
          description: Bad request
        '401':
          content:
            application/json:
              examples:
                unauthorizedExample:
                  summary: Unauthorized
                  value:
                    error: Unauthorized
                    message: 'security_exception: unable to authenticate user for REST request [/api/observability/slos]'
                    statusCode: 401
              schema:
                $ref: '#/components/schemas/SLOs_401_response'
          description: Unauthorized response
        '403':
          content:
            application/json:
              examples:
                forbiddenExample:
                  summary: Forbidden
                  value:
                    error: Forbidden
                    message: 'security_exception: action [slo_read] is unauthorized for user'
                    statusCode: 403
              schema:
                $ref: '#/components/schemas/SLOs_403_response'
          description: Forbidden response
      summary: Compute SLO instance summaries in bulk at a point in time
      tags:
      - slo
      x-state: Generally available; added in 9.6.0
      x-metaTags:
      - content: Kibana
        name: product_name
  /s/{spaceId}/api/observability/slos/_delete_instances:
    post:
      description: 'The deletion occurs for the specified list of `sloId` and `instanceId`. You must have `all` privileges for the **SLOs** feature in the **Observability** section of the Kibana feature privileges.

