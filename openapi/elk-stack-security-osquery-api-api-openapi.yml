      oneOf:
      - $ref: '#/components/schemas/Security_Osquery_API_LiveHistoryRow'
      - $ref: '#/components/schemas/Security_Osquery_API_ScheduledHistoryRow'
    Security_Osquery_API_UnifiedHistoryRowBase:
      type: object
      properties:
        agentCount:
          description: The number of agents targeted by the query.
          type: integer
        errorCount:
          description: The number of agent responses with errors.
          type:
          - integer
          - 'null'
        id:
          description: Unique identifier for the history row.
          type: string
        packId:
          description: The ID of the pack containing the query.
          type: string
        packName:
          description: The name of the pack containing the query.
          type: string
        queryName:
          description: The name of the query, if available.
          type: string
        queryText:
          description: The SQL query that was executed.
          type: string
        spaceId:
          description: The Kibana space ID where the query was executed.
          type: string
        successCount:
          description: The number of successful agent responses.
          type:
          - integer
          - 'null'
        timestamp:
          description: The timestamp of the query execution.
          type: string
        totalRows:
          description: The total number of result rows returned across all agents.
          type:
          - integer
          - 'null'
      required:
      - id
      - timestamp
      - queryText
      - agentCount
    Security_Osquery_API_Interval:
      description: An interval, in seconds, on which to run the query.
      example: '60'
      type: string
    Security_Osquery_API_ObjectQueries:
      additionalProperties:
        $ref: '#/components/schemas/Security_Osquery_API_ObjectQueriesItem'
      description: An object of queries.
      type: object
    Security_Osquery_API_ExportResultRow:
      additionalProperties: true
      description: 'A single result row from an NDJSON or JSON export. Fields follow the Elastic Common Schema (ECS) mapping defined on the originating query when available; otherwise raw osquery column names are used under the `osquery.*` namespace.

        '
      example:
        '@timestamp': '2026-04-30T09:11:58.321Z'
        agent:
          id: 980a6b73-0b03-4d1e-8915-67c202e4a980
          name: prod-host-1
          type: osquerybeat
          version: 9.4.0
        osquery:
          directory: /home/ubuntu
          gid: '1000'
          shell: /bin/bash
          uid: '1000'
          username: ubuntu
        user:
          group:
            id: '1000'
          id: '1000'
          name: ubuntu
      type: object
    Security_Osquery_API_ScheduleType:
      description: 'Discriminator for the pack''s schedule mode. `interval` uses native

        osqueryd interval scheduling (seconds). `rrule` uses osquerybeat''s

        RRULE-based recurrence scheduling. Per-query overrides MUST use the

        same mode as the pack — cross-mode overrides are rejected with 400.

        '
      enum:
      - interval
      - rrule
      example: rrule
      type: string
    Security_Osquery_API_ECSMappingItem:
      type: object
      properties:
        field:
          description: The ECS field to map to.
          example: host.uptime
          type: string
        value:
          description: The value to map to the ECS field.
          example: total_seconds
          oneOf:
          - type: string
          - items:
              type: string
            type: array
    Security_Osquery_API_UpdatePacksRequestBody:
      example:
        name: updated_my_pack_name
      type: object
      properties:
        description:
          $ref: '#/components/schemas/Security_Osquery_API_PackDescription'
        enabled:
          $ref: '#/components/schemas/Security_Osquery_API_Enabled'
        interval:
          $ref: '#/components/schemas/Security_Osquery_API_PackInterval'
        name:
          $ref: '#/components/schemas/Security_Osquery_API_PackName'
        policy_ids:
          $ref: '#/components/schemas/Security_Osquery_API_PolicyIds'
        queries:
          $ref: '#/components/schemas/Security_Osquery_API_ObjectQueries'
        rrule_schedule:
          $ref: '#/components/schemas/Security_Osquery_API_RRuleScheduleConfig'
        schedule_type:
          $ref: '#/components/schemas/Security_Osquery_API_ScheduleType'
        shards:
          $ref: '#/components/schemas/Security_Osquery_API_Shards'
    Security_Osquery_API_CreateLiveQueryResponse:
      description: The response for creating a live query.
      example:
        data:
          '@timestamp': '2022-07-26T09:59:32.220Z'
          action_id: 3c42c847-eb30-4452-80e0-728584042334
          agent_all: true
          agent_ids: []
          agent_platforms: []
          agent_policy_ids: []
          agents:
          - 16d7caf5-efd2-4212-9b62-73dafc91fa13
          expiration: '2022-07-26T10:04:32.220Z'
          input_type: osquery
          metadata:
            execution_context:
              name: osquery
              url: /app/osquery/live_queries/new
          queries:
          - action_id: 609c4c66-ba3d-43fa-afdd-53e244577aa0
            agents:
            - 16d7caf5-efd2-4212-9b62-73dafc91fa13
            ecs_mapping:
              host.uptime:
                field: total_seconds
            id: 6724a474-cbba-41ef-a1aa-66aebf0879e2
            query: select * from uptime;
            timeout: 120
          type: INPUT_ACTION
          user_id: elastic
      type: object
      properties:
        data:
          type: object
          properties:
            '@timestamp':
              description: The timestamp when the action was created.
              format: date-time
              type: string
            action_id:
              description: The ID of the action.
              type: string
            agent_all:
              description: Whether the query targets all agents.
              type: boolean
            agent_ids:
              description: The agent IDs targeted by the action.
              items:
                type: string
              type: array
            agent_platforms:
              description: The agent platforms targeted.
              items:
                type: string
              type: array
            agent_policy_ids:
              description: The agent policy IDs targeted.
              items:
                type: string
              type: array
            agents:
              description: The resolved list of agent IDs.
              items:
                type: string
              type: array
            expiration:
              description: The expiration date of the action.
              format: date-time
              type: string
            input_type:
              description: The input type.
              type: string
            metadata:
              description: Custom metadata associated with the action.
              type: object
            pack_id:
              description: The pack ID if the query was run from a pack.
              type: string
            queries:
              description: The queries in this action.
              items:
                type: object
                properties:
                  action_id:
                    type: string
                  agents:
                    items:
                      type: string
                    type: array
                  ecs_mapping:
                    $ref: '#/components/schemas/Security_Osquery_API_ECSMapping'
                  id:
                    type: string
                  platform:
                    type: string
                  query:
                    type: string
                  saved_query_id:
                    type: string
                  timeout:
                    type: integer
                  version:
                    type: string
              type: array
            type:
              description: The action type.
              type: string
            user_id:
              description: The user who created the action.
              type: string
          required:
          - action_id
      required:
      - data
    Security_Osquery_API_ExportMetadata:
      description: 'Metadata block produced for every export. Included as `_meta` in the JSON response body and as the first NDJSON line.

        '
      type: object
      properties:
        action_id:
          description: The action ID (live query) or schedule ID (scheduled query) that produced the results.
          example: e88d7652-fc3e-4544-b0e0-3d5df2be454c
          type: string
        csv_columns:
          description: 'For CSV exports with ECS mapping and zero hits: the column header row so an empty export is not a 0-byte file.

            '
          items:
            type: string
          type:
          - array
          - 'null'
        execution_count:
          description: 'For scheduled query exports only: the execution counter of the scheduled run that produced the results.

            '
          example: 17384
          type:
          - integer
          - 'null'
        exported_by:
          description: Username of the Kibana user who triggered the export.
          example: elastic
          type: string
        format:
          $ref: '#/components/schemas/Security_Osquery_API_ExportFormat'
        query:
          description: The SQL query text, if it could be resolved from action details.
          example: SELECT * FROM users;
          type:
          - string
          - 'null'
        timestamp:
          description: ISO 8601 timestamp of when the export was initiated.
          example: '2026-04-30T09:12:00.000Z'
          format: date-time
          type: string
        total_results:
          description: Total number of result rows included in this export.
          example: 64
          type:
          - integer
          - 'null'
      required:
      - action_id
      - timestamp
      - exported_by
      - format
    Security_Osquery_API_SortOrderOrUndefined:
      description: Specifies the sort order.
      enum:
      - asc
      - desc
      example: desc
      type: string
    Security_Osquery_API_RRuleScheduleConfig:
      description: 'RRULE schedule configuration consumed by osquerybeat. Loose date

        forms like `"2024-01-01"` are rejected with 400. DTSTART is NOT

        embedded in `rrule`; the separate `start_date` field is the

        schedule anchor.

        '
      type: object
      properties:
        end_date:
          description: Optional RFC 3339 datetime string for the schedule's end. MUST be after `start_date`.
          example: '2024-12-31T23:59:59Z'
          format: date-time
          maxLength: 64
          type: string
        rrule:
          description: 'Fully serialized RFC 5545 RRULE string (e.g.

            `"FREQ=WEEKLY;BYDAY=MO,WE,FR"`). The Kibana UI writes only a

            subset of parts — `FREQ`, `INTERVAL`, `BYDAY`, `BYMONTHDAY`,

            `BYMONTH` — but the server accepts and round-trips any

            well-formed parts (other recognized parts like `BYHOUR`,

            `BYMINUTE`, `BYSETPOS`, `WKST`, `COUNT`, `UNTIL` are preserved

            verbatim).

            '
          example: FREQ=WEEKLY;BYDAY=MO,WE,FR
          maxLength: 2048
          type: string
        splay:
          description: 'Optional Go duration string for splay (random execution delay),

            e.g. `"30s"`, `"5m"`, `"1h"`. The Kibana form writes single-unit

            values only; compound durations (`"1h30m"`) are tolerated on

            read for round-trip safety with osquerybeat''s writer. Maximum

            12 hours (43200 seconds).

            '
          example: 5m
          maxLength: 64
          type: string
        start_date:
          description: RFC 3339 datetime string for the schedule's start.
          example: '2024-01-01T00:00:00Z'
          format: date-time
          maxLength: 64
          type: string
        timeout:
          description: Optional query execution timeout, in seconds. Defaults to 60 in osquerybeat when unset.
          example: 60
          type: number
      required:
      - rrule
      - start_date
