                format: binary
                type: string
          description: 'A downloadable file in the requested format. The `Content-Disposition` header contains the suggested filename.

            '
          headers:
            Content-Disposition:
              description: Attachment disposition with a generated filename, e.g. `attachment; filename="osquery-scheduled-results-{scheduleId}-{executionCount}-{timestamp}.csv"`.
              schema:
                example: attachment; filename="osquery-scheduled-results-90f342ee-9c05-4844-849b-173993234f22-17384-2026-04-30T09-12-00-000Z.csv"
                type: string
        '400':
          content:
            application/json:
              examples:
                rowLimitExceeded:
                  summary: Result count exceeds the export limit
                  value:
                    message: Export limited to 500,000 results. Found 500,001. Please add filters to narrow results.
              schema:
                type: object
                properties:
                  message:
                    example: Export limited to 500,000 results. Found 500,001. Please add filters to narrow results.
                    type: string
          description: 'Bad request. Possible causes: invalid or missing `format` query parameter, malformed KQL in the request body, invalid `esFilters`, or the result count exceeds the 500,000-row limit.

            '
        '403':
          description: 'The authenticated user does not have the `osquery-read` privilege required to export scheduled query results.

            '
      summary: Export scheduled query results
      tags:
      - Security Osquery API
      x-state: Generally available; Added in 9.5.0
      x-metaTags:
      - content: Kibana
        name: product_name
  /api/osquery/scheduled_results/{scheduleId}/{executionCount}/results:
    get:
      description: '**Spaces method and path for this operation:**


        <div><span class="operation-verb get">get</span>&nbsp;<span class="operation-path">/s/{space_id}/api/osquery/scheduled_results/{scheduleId}/{executionCount}/results</span></div>


        Refer to [Spaces](https://www.elastic.co/docs/deploy-manage/manage-spaces) for more information.


        Get paginated query result rows (the actual osquery output data) for a specific scheduled query execution.

        '
      operationId: OsqueryGetScheduledQueryResults
      parameters:
      - description: The schedule ID of the scheduled query.
        in: path
        name: scheduleId
        required: true
        schema:
          description: The schedule ID of the scheduled query.
          example: pack_my_pack_uptime
          type: string
      - description: The execution count for this scheduled query run.
        in: path
        name: executionCount
        required: true
        schema:
          description: The execution count for this scheduled query run.
          example: 3
          type: integer
      - description: The kuery to filter the results by.
        in: query
        name: kuery
        required: false
        schema:
          $ref: '#/components/schemas/Security_Osquery_API_KueryOrUndefined'
      - description: The page number to return. The default is 1.
        in: query
        name: page
        required: false
        schema:
          $ref: '#/components/schemas/Security_Osquery_API_PageOrUndefined'
      - description: The number of results to return per page. The default is 20.
        in: query
        name: pageSize
        required: false
        schema:
          $ref: '#/components/schemas/Security_Osquery_API_PageSizeOrUndefined'
      - description: The field that is used to sort the results.
        in: query
        name: sort
        required: false
        schema:
          $ref: '#/components/schemas/Security_Osquery_API_SortOrUndefined'
      - description: Specifies the sort order.
        in: query
        name: sortOrder
        required: false
        schema:
          $ref: '#/components/schemas/Security_Osquery_API_SortOrderOrUndefined'
      - description: The start date filter (ISO 8601) to narrow down results.
        in: query
        name: startDate
        required: false
        schema:
          description: The start date filter (ISO 8601) to narrow down results.
          example: '2024-01-01T00:00:00Z'
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                scheduledQueryResultsExample:
                  summary: Example scheduled query results response
                  value:
                    data:
                      edges:
                      - _id: row-001
                        fields:
                          host.uptime:
                          - '12345'
                      - _id: row-002
                        fields:
                          host.uptime:
                          - '67890'
                      total: 2
              schema:
                $ref: '#/components/schemas/Security_Osquery_API_GetScheduledQueryResultsResponse'
          description: Indicates a successful call.
      summary: Get scheduled query results
      tags:
      - Security Osquery API
      x-state: Generally available; Added in 9.4.0
      x-metaTags:
      - content: Kibana
        name: product_name
components:
  schemas:
    Security_Osquery_API_UnifiedHistoryRow:
      discriminator:
        mapping:
          live: '#/components/schemas/Security_Osquery_API_LiveHistoryRow'
          scheduled: '#/components/schemas/Security_Osquery_API_ScheduledHistoryRow'
