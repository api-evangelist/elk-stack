                query: prod-host-1
              type: phrase
            query:
              match_phrase:
                agent.name: prod-host-1
          items:
            additionalProperties: true
            type: object
          type:
          - array
          - 'null'
        kuery:
          description: 'An optional KQL filter appended (with AND) to the base action/schedule filter. The filter is wrapped in parentheses so it cannot override or escape the built-in action_id / schedule_id gate.

            '
          example: 'host.name: "prod-host-1"'
          type:
          - string
