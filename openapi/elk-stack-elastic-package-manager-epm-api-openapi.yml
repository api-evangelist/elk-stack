                  value:
                    items:
                    - count: 42
                      id: security
                      title: Security
                    - count: 38
                      id: observability
                      title: Observability
              schema:
                $ref: '#/components/schemas/Kibana_HTTP_APIs_get_categories_response'
          description: Successful response
        '400':
          content:
            application/json:
              examples:
                genericErrorResponseExample:
                  description: Example of a generic error response
                  value:
                    error: Bad Request
                    message: An error message describing what went wrong
                    statusCode: 400
              schema:
                additionalProperties: false
                description: Generic Error
                type: object
                properties:
                  attributes: {}
                  error:
                    type: string
                  errorType:
                    type: string
                  message:
                    type: string
                  statusCode:
                    type: number
                required:
                - message
