      allOf:
      - $ref: '#/components/schemas/_types.aggregations.MetricAggregationBase'
      - type: object
    _types.GeoBounds:
      description: 'A geo bounding box. It can be represented in various ways:

        - as 4 top/bottom/left/right coordinates

        - as 2 top_left / bottom_right points

        - as 2 top_right / bottom_left points

        - as a WKT bounding box'
      oneOf:
      - $ref: '#/components/schemas/_types.CoordsGeoBounds'
      - $ref: '#/components/schemas/_types.TopLeftBottomRightGeoBounds'
      - $ref: '#/components/schemas/_types.TopRightBottomLeftGeoBounds'
      - $ref: '#/components/schemas/_types.WktGeoBounds'
    _global.search._types.SearchRequestBody:
      type: object
      properties:
        aggregations:
          externalDocs:
            url: https://www.elastic.co/docs/explore-analyze/query-filter/aggregations
          description: Defines the aggregations that are run as part of the search request.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/_types.aggregations.AggregationContainer'
        collapse:
          description: Collapses search results the values of the specified field.
          allOf:
          - $ref: '#/components/schemas/_global.search._types.FieldCollapse'
        explain:
          description: If `true`, the request returns detailed information about score computation as part of a hit.
          default: false
          type: boolean
        ext:
          description: Configuration of search extensions defined by Elasticsearch plugins.
          type: object
          additionalProperties:
            type: object
        from:
          description: 'The starting document offset, which must be non-negative.

            By default, you cannot page through more than 10,000 hits using the `from` and `size` parameters.

            To page through more hits, use the `search_after` parameter.'
          default: 0.0
          type: number
        highlight:
          externalDocs:
            url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/highlighting
          description: Specifies the highlighter to use for retrieving highlighted snippets from one or more fields in your search results.
          allOf:
          - $ref: '#/components/schemas/_global.search._types.Highlight'
        track_total_hits:
          description: 'Number of hits matching the query to count accurately.

            If `true`, the exact number of hits is returned at the cost of some performance.

            If `false`, the  response does not include the total number of hits matching the query.'
          default: '10000'
          allOf:
          - $ref: '#/components/schemas/_global.search._types.TrackHits'
        indices_boost:
          externalDocs:
            url: https://www.elastic.co/docs/explore-analyze/query-filter/languages/querydsl#relevance-scores
          description: 'Boost the `_score` of documents from specified indices.

            The boost value is the factor by which scores are multiplied.

            A boost value greater than `1.0` increases the score.

            A boost value between `0` and `1.0` decreases the score.'
          type: array
          items:
            type: object
            additionalProperties:
              type: number
            minProperties: 1
            maxProperties: 1
        docvalue_fields:
          externalDocs:
            url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/retrieve-selected-fields#docvalue-fields
          description: 'An array of wildcard (`*`) field patterns.

            The request returns doc values for field names matching these patterns in the `hits.fields` property of the response.'
          type: array
          items:
            $ref: '#/components/schemas/_types.query_dsl.FieldAndFormat'
        knn:
          externalDocs:
            url: https://www.elastic.co/docs/solutions/search/vector/knn#approximate-knn
          description: The approximate kNN search to run.
          x-state: Generally available; Added in 8.4.0
          oneOf:
          - $ref: '#/components/schemas/_types.KnnSearch'
          - type: array
            items:
              $ref: '#/components/schemas/_types.KnnSearch'
        rank:
          description: The Reciprocal Rank Fusion (RRF) to use.
          x-state: Generally available; Added in 8.8.0
          allOf:
          - $ref: '#/components/schemas/_types.RankContainer'
        min_score:
          description: 'The minimum `_score` for matching documents.

            Documents with a lower `_score` are not included in search results or results collected by aggregations.'
          type: number
        post_filter:
          externalDocs:
            url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/filter-search-results
          description: 'Use the `post_filter` parameter to filter search results.

            The search hits are filtered after the aggregations are calculated.

            A post filter has no impact on the aggregation results.'
          allOf:
          - $ref: '#/components/schemas/_types.query_dsl.QueryContainer'
        profile:
          externalDocs:
            url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/search-profile
          description: 'Set to `true` to return detailed timing information about the execution of individual components in a search request.

            NOTE: This is a debugging tool and adds significant overhead to search execution.'
          default: false
          type: boolean
        query:
          externalDocs:
            url: https://www.elastic.co/docs/explore-analyze/query-filter/languages/querydsl
          description: The search definition using the Query DSL.
          allOf:
          - $ref: '#/components/schemas/_types.query_dsl.QueryContainer'
        rescore:
          externalDocs:
            url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/rescore-search-results
          description: Can be used to improve precision by reordering just the top (for example 100 - 500) documents returned by the `query` and `post_filter` phases.
          oneOf:
          - $ref: '#/components/schemas/_global.search._types.Rescore'
          - type: array
            items:
              $ref: '#/components/schemas/_global.search._types.Rescore'
        retriever:
          externalDocs:
            url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/retrievers
          description: 'A retriever is a specification to describe top documents returned from a search.

            A retriever replaces other elements of the search API that also return top documents such as `query` and `knn`.'
          x-state: Generally available; Added in 8.14.0
          allOf:
          - $ref: '#/components/schemas/_types.RetrieverContainer'
        script_fields:
          description: Retrieve a script evaluation (based on different fields) for each hit.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/_types.ScriptField'
        search_after:
          externalDocs:
            url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/paginate-search-results#search-after
          description: Used to retrieve the next page of hits using a set of sort values from the previous page.
          allOf:
          - $ref: '#/components/schemas/_types.SortResults'
        size:
          description: 'The number of hits to return, which must not be negative.

            By default, you cannot page through more than 10,000 hits using the `from` and `size` parameters.

            To page through more hits, use the `search_after` property.'
          default: 10.0
          type: number
        slice:
          externalDocs:
            url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/paginate-search-results#slice-scroll
          description: Split a scrolled search into multiple slices that can be consumed independently.
          allOf:
          - $ref: '#/components/schemas/_types.SlicedScroll'
        sort:
          externalDocs:
            url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/sort-search-results
          description: A comma-separated list of <field>:<direction> pairs.
          allOf:
          - $ref: '#/components/schemas/_types.Sort'
        _source:
          externalDocs:
            url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/retrieve-selected-fields#source-filtering
          description: 'The source fields that are returned for matching documents.

            These fields are returned in the `hits._source` property of the search response.

            If the `stored_fields` property is specified, the `_source` property defaults to `false`.

            Otherwise, it defaults to `true`.'
          allOf:
          - $ref: '#/components/schemas/_global.search._types.SourceConfig'
        fields:
          description: 'An array of wildcard (`*`) field patterns.

            The request returns values for field names matching these patterns in the `hits.fields` property of the response.'
          type: array
          items:
            $ref: '#/components/schemas/_types.query_dsl.FieldAndFormat'
        suggest:
          externalDocs:
            url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/search-suggesters
          description: Defines a suggester that provides similar looking terms based on a provided text.
          allOf:
          - $ref: '#/components/schemas/_global.search._types.Suggester'
        terminate_after:
          description: 'The maximum number of documents to collect for each shard.

            If a query reaches this limit, Elasticsearch terminates the query early.

            Elasticsearch collects documents before sorting.


            IMPORTANT: Use with caution.

            Elasticsearch applies this property to each shard handling the request.

            When possible, let Elasticsearch perform early termination automatically.

            Avoid specifying this property for requests that target data streams with backing indices across multiple data tiers.


            If set to `0` (default), the query does not terminate early.'
          default: 0.0
          type: number
        timeout:
          description: 'The period of time to wait for a response from each shard.

            If no response is received before the timeout expires, the request fails and returns an error.

            Defaults to no timeout.'
          type: string
        track_scores:
          description: If `true`, calculate and return document scores, even if the scores are not used for sorting.
          default: false
          type: boolean
        version:
          description: If `true`, the request returns the document version as part of a hit.
          default: false
          type: boolean
        seq_no_primary_term:
          externalDocs:
            url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/optimistic-concurrency-control
          description: If `true`, the request returns sequence number and primary term of the last modification of each hit.
          type: boolean
        stored_fields:
          externalDocs:
            url: https://www.elastic.co/docs/reference/elasticsearch/rest-apis/retrieve-selected-fields#stored-fields
          description: 'A comma-separated list of stored fields to return as part of a hit.

            If no fields are specified, no stored fields are included in the response.

            If this field is specified, the `_source` property defaults to `false`.

            You can pass `_source: true` to return both source fields and stored fields in the search response.'
          allOf:
          - $ref: '#/components/schemas/_types.Fields'
        pit:
          description: 'Limit the search to a point in time (PIT).

            If you provide a PIT, you cannot specify an `<index>` in the request path.'
          allOf:
          - $ref: '#/components/schemas/_global.search._types.PointInTimeReference'
        runtime_mappings:
          externalDocs:
            url: https://www.elastic.co/docs/manage-data/data-store/mapping/define-runtime-fields-in-search-request
          description: 'One or more runtime fields in the search request.

            These fields take precedence over mapped fields with the same name.'
          allOf:
          - $ref: '#/components/schemas/_types.mapping.RuntimeFields'
        stats:
          description: 'The stats groups to associate with the search.

            Each group maintains a statistics aggregation for its associated searches.

            You can retrieve these stats using the indices stats API.'
          type: array
          items:
            type: string
