      oneOf:
      - type: string
      - $ref: '#/components/schemas/_types.analysis.CharFilterDefinition'
    _types.analysis.TruncateTokenFilter:
      allOf:
      - $ref: '#/components/schemas/_types.analysis.TokenFilterBase'
      - type: object
        properties:
          type:
            type: string
