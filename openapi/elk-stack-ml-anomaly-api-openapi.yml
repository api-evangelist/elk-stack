              $ref: '#/components/schemas/_types.SpecifiedDocument'
          rank_window_size:
            type: number
        required:
        - retriever
    _types.RRFRetrieverComponent:
      description: Wraps a retriever with an optional weight for RRF scoring.
      type: object
      properties:
        retriever:
          description: The nested retriever configuration.
          allOf:
          - $ref: '#/components/schemas/_types.RetrieverContainer'
        weight:
          description: Weight multiplier for this retriever's contribution to the RRF score. Higher values increase influence. Defaults to 1.0 if not specified. Must be non-negative.
          default: 1.0
          type: number
      required:
      - retriever
    _types.IndicesOptions:
      description: 'Controls how to deal with unavailable concrete indices (closed or missing), how wildcard expressions are expanded

        to actual indices (all, closed or open indices) and how to deal with wildcard expressions that resolve to no indices.'
      type: object
      properties:
        allow_no_indices:
          description: 'A setting that does two separate checks on the index expression.

            If `false`, the request returns an error (1) if any wildcard expression

            (including `_all` and `*`) resolves to zero matching indices or (2) if the

            complete set of resolved indices, aliases or data streams is empty after all

            expressions are evaluated. If `true`, index expressions that resolve to no

            indices are allowed and the request returns an empty result.'
          type: boolean
        expand_wildcards:
          description: 'Type of index that wildcard patterns can match. If the request can target data streams, this argument

            determines whether wildcard expressions match hidden data streams. Supports comma-separated values,

            such as `open,hidden`.'
          allOf:
          - $ref: '#/components/schemas/_types.ExpandWildcards'
        ignore_unavailable:
          description: 'If `false`, the request returns an error if it targets a concrete (non-wildcarded)

            index, alias, or data stream that is missing, closed, or otherwise unavailable.

            If `true`, unavailable concrete targets are silently ignored.'
          default: false
          type: boolean
        ignore_throttled:
          description: If true, concrete, expanded or aliased indices are ignored when frozen.
          default: true
          type: boolean
    _types.analysis.PhoneticEncoder:
      type: string
      enum:
      - metaphone
      - double_metaphone
      - soundex
      - refined_soundex
      - caverphone1
      - caverphone2
      - cologne
      - nysiis
      - koelnerphonetik
      - haasephonetik
      - beider_morse
      - daitch_mokotoff
    _types.ScriptField:
      type: object
