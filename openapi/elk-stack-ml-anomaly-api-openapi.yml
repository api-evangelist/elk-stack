    ml._types.Influencer:
      type: object
      properties:
        bucket_span:
          description: The length of the bucket in seconds. This value matches the bucket span that is specified in the job.
          allOf:
          - $ref: '#/components/schemas/_types.DurationValueUnitSeconds'
        influencer_score:
          description: 'A normalized score between 0-100, which is based on the probability of the influencer in this bucket aggregated

            across detectors. Unlike `initial_influencer_score`, this value is updated by a re-normalization process as new

            data is analyzed.'
          type: number
        influencer_field_name:
          description: The field name of the influencer.
          allOf:
          - $ref: '#/components/schemas/_types.Field'
        influencer_field_value:
          description: The entity that influenced, contributed to, or was to blame for the anomaly.
          type: string
        initial_influencer_score:
          description: 'A normalized score between 0-100, which is based on the probability of the influencer aggregated across detectors.

            This is the initial value that was calculated at the time the bucket was processed.'
          type: number
        is_interim:
          description: If true, this is an interim result. In other words, the results are calculated based on partial input data.
          type: boolean
        job_id:
          description: Identifier for the anomaly detection job.
          allOf:
          - $ref: '#/components/schemas/_types.Id'
        probability:
          description: 'The probability that the influencer has this behavior, in the range 0 to 1. This value can be held to a high

            precision of over 300 decimal places, so the `influencer_score` is provided as a human-readable and friendly

            interpretation of this value.'
          type: number
        result_type:
          description: Internal. This value is always set to `influencer`.
          type: string
        timestamp:
          description: The start time of the bucket for which these results were calculated.
          allOf:
          - $ref: '#/components/schemas/_types.EpochTimeUnitMillis'
        foo:
          description: 'Additional influencer properties are added, depending on the fields being analyzed. For example, if it’s

            analyzing `user_name` as an influencer, a field `user_name` is added to the result document. This

            information enables you to filter the anomaly results more easily.'
          type: string
      required:
      - bucket_span
      - influencer_score
      - influencer_field_name
      - influencer_field_value
      - initial_influencer_score
      - is_interim
      - job_id
      - probability
      - result_type
      - timestamp
    _types.query_dsl.SpanNotQuery:
