    _types.analysis.LimitTokenCountTokenFilter:
      allOf:
      - $ref: '#/components/schemas/_types.analysis.TokenFilterBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - limit
          consume_all_tokens:
            description: If `true`, the limit filter exhausts the token stream, even if the `max_token_count` has already been reached. Defaults to `false`.
            type: boolean
          max_token_count:
            description: Maximum number of tokens to keep. Once this limit is reached, any remaining tokens are excluded from the output. Defaults to `1`.
            allOf:
            - $ref: '#/components/schemas/_spec_utils.Stringifiedinteger'
        required:
        - type
    ml._types.JobConfig:
      type: object
      properties:
        allow_lazy_open:
          description: Advanced configuration option. Specifies whether this job can open when there is insufficient machine learning node capacity for it to be immediately assigned to a node.
          default: false
          type: boolean
        analysis_config:
          description: 'The analysis configuration, which specifies how to analyze the data.

            After you create a job, you cannot change the analysis configuration; all the properties are informational.'
          allOf:
          - $ref: '#/components/schemas/ml._types.AnalysisConfig'
        analysis_limits:
          description: 'Limits can be applied for the resources required to hold the mathematical models in memory.

            These limits are approximate and can be set per job.

            They do not control the memory used by other processes, for example the Elasticsearch Java processes.'
          allOf:
          - $ref: '#/components/schemas/ml._types.AnalysisLimits'
        background_persist_interval:
          description: 'Advanced configuration option.

            The time between each periodic persistence of the model.

            The default value is a randomized value between 3 to 4 hours, which avoids all jobs persisting at exactly the same time.

            The smallest allowed value is 1 hour.'
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        custom_settings:
          description: 'Advanced configuration option.

            Contains custom metadata about the job.'
          allOf:
          - $ref: '#/components/schemas/ml._types.CustomSettings'
        daily_model_snapshot_retention_after_days:
          description: 'Advanced configuration option, which affects the automatic removal of old model snapshots for this job.

            It specifies a period of time (in days) after which only the first snapshot per day is retained.

            This period is relative to the timestamp of the most recent snapshot for this job.'
          default: 1.0
          type: number
        data_description:
          description: 'The data description defines the format of the input data when you send data to the job by using the post data API.

            Note that when configure a datafeed, these properties are automatically set.'
          allOf:
          - $ref: '#/components/schemas/ml._types.DataDescription'
        datafeed_config:
          description: 'The datafeed, which retrieves data from Elasticsearch for analysis by the job.

            You can associate only one datafeed with each anomaly detection job.'
          allOf:
          - $ref: '#/components/schemas/ml._types.DatafeedConfig'
        description:
          description: A description of the job.
          type: string
        groups:
          description: A list of job groups. A job can belong to no groups or many.
          type: array
          items:
            type: string
        job_id:
          description: 'Identifier for the anomaly detection job.

            This identifier can contain lowercase alphanumeric characters (a-z and 0-9), hyphens, and underscores.

            It must start and end with alphanumeric characters.'
          allOf:
          - $ref: '#/components/schemas/_types.Id'
        model_plot_config:
          description: 'This advanced configuration option stores model information along with the results.

            It provides a more detailed view into anomaly detection.

            Model plot provides a simplified and indicative view of the model and its bounds.'
          allOf:
          - $ref: '#/components/schemas/ml._types.ModelPlotConfig'
        model_snapshot_retention_days:
          description: 'Advanced configuration option, which affects the automatic removal of old model snapshots for this job.

            It specifies the maximum period of time (in days) that snapshots are retained.

            This period is relative to the timestamp of the most recent snapshot for this job.

            The default value is `10`, which means snapshots ten days older than the newest snapshot are deleted.'
          default: 10.0
          type: number
        renormalization_window_days:
          description: 'Advanced configuration option.

            The period over which adjustments to the score are applied, as new data is seen.

            The default value is the longer of 30 days or 100 `bucket_spans`.'
          type: number
        results_index_name:
          description: 'A text string that affects the name of the machine learning results index.

            The default value is `shared`, which generates an index named `.ml-anomalies-shared`.'
          default: shared
          allOf:
          - $ref: '#/components/schemas/_types.IndexName'
        results_retention_days:
          description: 'Advanced configuration option.

            The period of time (in days) that results are retained.

            Age is calculated relative to the timestamp of the latest bucket result.

            If this property has a non-null value, once per day at 00:30 (server time), results that are the specified number of days older than the latest bucket result are deleted from Elasticsearch.

            The default value is null, which means all results are retained.

            Annotations generated by the system also count as results for retention purposes; they are deleted after the same number of days as results.

            Annotations added by users are retained forever.'
          type: number
      required:
      - analysis_config
      - data_description
    _types.aggregations.SamplerAggregation:
      allOf:
      - $ref: '#/components/schemas/_types.aggregations.BucketAggregationBase'
      - type: object
        properties:
          shard_size:
            description: Limits how many top-scoring documents are collected in the sample processed on each shard.
            default: 100.0
            type: number
    _types.query_dsl.PinnedQuery:
      allOf:
      - $ref: '#/components/schemas/_types.query_dsl.QueryBase'
      - externalDocs:
          url: https://www.elastic.co/docs/reference/query-languages/query-dsl/query-dsl-pinned-query
        allOf:
        - type: object
          properties:
            organic:
              description: Any choice of query used to rank documents which will be ranked below the "pinned" documents.
              allOf:
              - $ref: '#/components/schemas/_types.query_dsl.QueryContainer'
          required:
          - organic
        - type: object
          properties:
            ids:
              description: 'Document IDs listed in the order they are to appear in results.

                Required if `docs` is not specified.'
              type: array
              items:
                $ref: '#/components/schemas/_types.Id'
            docs:
              description: 'Documents listed in the order they are to appear in results.

                Required if `ids` is not specified.'
              type: array
              items:
                $ref: '#/components/schemas/_types.query_dsl.PinnedDoc'
          minProperties: 1
          maxProperties: 1
    _global.search._types.HighlighterTagsSchema:
      type: string
      enum:
      - styled
    ml._types.Category:
      type: object
      properties:
        category_id:
          description: A unique identifier for the category. category_id is unique at the job level, even when per-partition categorization is enabled.
          allOf:
          - $ref: '#/components/schemas/_types.ulong'
        examples:
          description: A list of examples of actual values that matched the category.
          type: array
          items:
            type: string
        grok_pattern:
          description: '[experimental] A Grok pattern that could be used in Logstash or an ingest pipeline to extract fields from messages that match the category. This field is experimental and may be changed or removed in a future release. The Grok patterns that are found are not optimal, but are often a good starting point for manual tweaking.'
          allOf:
          - $ref: '#/components/schemas/_types.GrokPattern'
        job_id:
          description: Identifier for the anomaly detection job.
          allOf:
          - $ref: '#/components/schemas/_types.Id'
        max_matching_length:
          description: The maximum length of the fields that matched the category. The value is increased by 10% to enable matching for similar fields that have not been analyzed.
          allOf:
          - $ref: '#/components/schemas/_types.ulong'
        partition_field_name:
          description: If per-partition categorization is enabled, this property identifies the field used to segment the categorization. It is not present when per-partition categorization is disabled.
          type: string
        partition_field_value:
          description: If per-partition categorization is enabled, this property identifies the value of the partition_field_name for the category. It is not present when per-partition categorization is disabled.
          type: string
        regex:
          description: A regular expression that is used to search for values that match the category.
          type: string
        terms:
          description: A space separated list of the common tokens that are matched in values of the category.
          type: string
        num_matches:
          description: The number of messages that have been matched by this category. This is only guaranteed to have the latest accurate count after a job _flush or _close
          type: number
        preferred_to_categories:
          description: A list of category_id entries that this current category encompasses. Any new message that is processed by the categorizer will match against this category and not any of the categories in this list. This is only guaranteed to have the latest accurate list of categories after a job _flush or _close
          type: array
          items:
            $ref: '#/components/schemas/_types.Id'
        p:
          type: string
        result_type:
          type: string
        mlcategory:
          type: string
      required:
      - category_id
      - examples
      - job_id
      - max_matching_length
      - regex
      - terms
      - result_type
      - mlcategory
    ml._types.CategorizationStatus:
      type: string
      enum:
      - ok
      - warn
    _types.aggregations.IpRangeAggregationRange:
      type: object
      properties:
        from:
          description: Start of the range.
          oneOf:
          - type: string
          - type:
            - string
            - 'null'
        mask:
          description: IP range defined as a CIDR mask.
          type: string
        to:
          description: End of the range.
          oneOf:
          - type: string
          - type:
            - string
            - 'null'
    _types.ScriptSort:
      type: object
      properties:
        order:
          allOf:
          - $ref: '#/components/schemas/_types.SortOrder'
        script:
          allOf:
          - $ref: '#/components/schemas/_types.Script'
        type:
          allOf:
          - $ref: '#/components/schemas/_types.ScriptSortType'
        mode:
          allOf:
          - $ref: '#/components/schemas/_types.SortMode'
        nested:
          allOf:
          - $ref: '#/components/schemas/_types.NestedSortValue'
      required:
      - script
    _types.query_dsl.FunctionScoreContainer:
      allOf:
      - type: object
        properties:
          filter:
            allOf:
            - $ref: '#/components/schemas/_types.query_dsl.QueryContainer'
          weight:
            type: number
          _name:
            description: A name to identify which function matched and influenced the score.
            x-state: Generally available; Added in 9.4.0
            type: string
      - type: object
        properties:
          exp:
            description: Function that scores a document with a exponential decay, depending on the distance of a numeric field value of the document from an origin.
            allOf:
            - $ref: '#/components/schemas/_types.query_dsl.DecayFunction'
          gauss:
            description: Function that scores a document with a normal decay, depending on the distance of a numeric field value of the document from an origin.
            allOf:
            - $ref: '#/components/schemas/_types.query_dsl.DecayFunction'
          linear:
            description: Function that scores a document with a linear decay, depending on the distance of a numeric field value of the document from an origin.
            allOf:
            - $ref: '#/components/schemas/_types.query_dsl.DecayFunction'
          field_value_factor:
            description: 'Function allows you to use a field from a document to influence the score.

              It’s similar to using the script_score function, however, it avoids the overhead of scripting.'
            allOf:
            - $ref: '#/components/schemas/_types.query_dsl.FieldValueFactorScoreFunction'
          random_score:
            description: 'Generates scores that are uniformly distributed from 0 up to but not including 1.

              In case you want scores to be reproducible, it is possible to provide a `seed` and `field`.'
            allOf:
            - $ref: '#/components/schemas/_types.query_dsl.RandomScoreFunction'
          script_score:
            description: Enables you to wrap another query and customize the scoring of it optionally with a computation derived from other numeric field values in the doc using a script expression.
            allOf:
            - $ref: '#/components/schemas/_types.query_dsl.ScriptScoreFunction'
        minProperties: 1
        maxProperties: 1
    ml._types.ChunkingConfig:
      type: object
      properties:
        mode:
          description: 'If the mode is `auto`, the chunk size is dynamically calculated;

            this is the recommended value when the datafeed does not use aggregations.

            If the mode is `manual`, chunking is applied according to the specified `time_span`;

            use this mode when the datafeed uses aggregations. If the mode is `off`, no chunking is applied.'
          allOf:
          - $ref: '#/components/schemas/ml._types.ChunkingMode'
        time_span:
          description: The time span that each search will be querying. This setting is applicable only when the `mode` is set to `manual`.
          default: 3h
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
      required:
      - mode
    _types.aggregations.HoltWintersType:
      type: string
      enum:
      - add
      - mult
    _types.analysis.IcuTokenizer:
      allOf:
      - $ref: '#/components/schemas/_types.analysis.TokenizerBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - icu_tokenizer
          rule_files:
            type: string
        required:
        - type
        - rule_files
    inference._types.EmbeddingContentFormat:
      type: string
      enum:
      - text
      - base64
    ml._types.FilterType:
      type: string
      enum:
      - include
      - exclude
    ml._types.BucketInfluencer:
      type: object
      properties:
        anomaly_score:
          description: 'A normalized score between 0-100, which is calculated for each bucket influencer. This score might be updated as

            newer data is analyzed.'
          type: number
        bucket_span:
          description: The length of the bucket in seconds. This value matches the bucket span that is specified in the job.
          allOf:
          - $ref: '#/components/schemas/_types.DurationValueUnitSeconds'
        influencer_field_name:
          description: The field name of the influencer.
          allOf:
          - $ref: '#/components/schemas/_types.Field'
        initial_anomaly_score:
          description: 'The score between 0-100 for each bucket influencer. This score is the initial value that was calculated at the

            time the bucket was processed.'
          type: number
        is_interim:
          description: If true, this is an interim result. In other words, the results are calculated based on partial input data.
          type: boolean
        job_id:
          description: Identifier for the anomaly detection job.
          allOf:
          - $ref: '#/components/schemas/_types.Id'
        probability:
          description: 'The probability that the bucket has this behavior, in the range 0 to 1. This value can be held to a high precision

            of over 300 decimal places, so the `anomaly_score` is provided as a human-readable and friendly interpretation of

            this.'
          type: number
        raw_anomaly_score:
          description: Internal.
          type: number
        result_type:
          description: Internal. This value is always set to `bucket_influencer`.
          type: string
        timestamp:
          description: The start time of the bucket for which these results were calculated.
          allOf:
          - $ref: '#/components/schemas/_types.EpochTimeUnitMillis'
        timestamp_string:
          description: The start time of the bucket for which these results were calculated.
          allOf:
          - $ref: '#/components/schemas/_types.DateTime'
      required:
      - anomaly_score
      - bucket_span
      - influencer_field_name
      - initial_anomaly_score
      - is_interim
      - job_id
      - probability
      - raw_anomaly_score
      - result_type
      - timestamp
    _types.analysis.WordDelimiterGraphTokenFilter:
      allOf:
      - $ref: '#/components/schemas/_types.analysis.WordDelimiterTokenFilterBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - word_delimiter_graph
          adjust_offsets:
            description: If `true`, the filter adjusts the offsets of split or catenated tokens to better reflect their actual position in the token stream. Defaults to `true`.
            type: boolean
          ignore_keywords:
            description: If `true`, the filter skips tokens with a keyword attribute of true. Defaults to `false`.
            type: boolean
        required:
        - type
    _types.query_dsl.IntervalsAllOf:
      type: object
      properties:
