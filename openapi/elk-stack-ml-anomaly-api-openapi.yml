        check_window:
          description: 'The window of time that is searched for late data. This window of time ends with the latest finalized bucket.

            It defaults to null, which causes an appropriate `check_window` to be calculated when the real-time datafeed runs.

            In particular, the default `check_window` span calculation is based on the maximum of `2h` or `8 * bucket_span`.'
          allOf:
          - $ref: '#/components/schemas/_types.Duration'
        enabled:
          description: Specifies whether the datafeed periodically checks for delayed data.
          type: boolean
      required:
      - enabled
    _types.aggregations.TermsAggregation:
      allOf:
      - $ref: '#/components/schemas/_types.aggregations.BucketAggregationBase'
      - type: object
        properties:
          collect_mode:
            description: 'Determines how child aggregations should be calculated: breadth-first or depth-first.'
            allOf:
            - $ref: '#/components/schemas/_types.aggregations.TermsAggregationCollectMode'
          exclude:
            description: 'Values to exclude.

              Accepts regular expressions and partitions.'
            allOf:
            - $ref: '#/components/schemas/_types.aggregations.TermsExclude'
          execution_hint:
            description: Determines whether the aggregation will use field values directly or global ordinals.
            allOf:
            - $ref: '#/components/schemas/_types.aggregations.TermsAggregationExecutionHint'
          field:
            description: The field from which to return terms.
            allOf:
            - $ref: '#/components/schemas/_types.Field'
          include:
            description: 'Values to include.

              Accepts regular expressions and partitions.'
            allOf:
            - $ref: '#/components/schemas/_types.aggregations.TermsInclude'
          min_doc_count:
            description: Only return values that are found in more than `min_doc_count` hits.
            default: 1.0
            type: number
          missing:
            description: 'The value to apply to documents that do not have a value.

              By default, documents without a value are ignored.'
            allOf:
            - $ref: '#/components/schemas/_types.aggregations.Missing'
          missing_order:
            allOf:
            - $ref: '#/components/schemas/_types.aggregations.MissingOrder'
          missing_bucket:
            type: boolean
          value_type:
            description: Coerced unmapped fields into the specified type.
            type: string
          order:
            description: 'Specifies the sort order of the buckets.

              Defaults to sorting by descending document count.'
            allOf:
            - $ref: '#/components/schemas/_types.aggregations.AggregateOrder'
          script:
            allOf:
            - $ref: '#/components/schemas/_types.Script'
          shard_min_doc_count:
            description: 'Regulates the certainty a shard has if the term should actually be added to the candidate list or not with respect to the `min_doc_count`.

              Terms will only be considered if their local shard frequency within the set is higher than the `shard_min_doc_count`.'
            type: number
          shard_size:
            description: 'The number of candidate terms produced by each shard.

              By default, `shard_size` will be automatically estimated based on the number of shards and the `size` parameter.'
            type: number
          show_term_doc_count_error:
            description: Set to `true` to return the `doc_count_error_upper_bound`, which is an upper bound to the error on the `doc_count` returned by each shard.
            type: boolean
          size:
            description: The number of buckets returned out of the overall terms list.
            default: 10.0
            type: number
          format:
            type: string
