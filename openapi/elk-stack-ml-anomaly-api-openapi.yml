      - $ref: '#/components/schemas/_types.query_dsl.QueryBase'
      - type: object
        properties:
          dist:
            description: 'The number of tokens from within the include span that can’t have overlap with the exclude span.

              Equivalent to setting both `pre` and `post`.'
