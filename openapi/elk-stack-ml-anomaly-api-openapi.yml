    _types.query_dsl.SparseVectorQuery:
      allOf:
      - $ref: '#/components/schemas/_types.query_dsl.QueryBase'
      - externalDocs:
          url: https://www.elastic.co/docs/reference/query-languages/query-dsl/query-dsl-sparse-vector-query
        allOf:
        - type: object
          properties:
            field:
              description: 'The name of the field that contains the token-weight pairs to be searched against.

                This field must be a mapped sparse_vector field.'
              allOf:
              - $ref: '#/components/schemas/_types.Field'
            query:
              description: 'The query text you want to use for search.

                If inference_id is specified, query must also be specified.'
              type: string
            prune:
              description: 'Whether to perform pruning, omitting the non-significant tokens from the query to improve query performance.

                If prune is true but the pruning_config is not specified, pruning will occur but default values will be used.

                Default: false'
              x-state: Generally available; Added in 8.15.0
              type: boolean
            pruning_config:
              description: 'Optional pruning configuration.

                If enabled, this will omit non-significant tokens from the query in order to improve query performance.

                This is only used if prune is set to true.

                If prune is set to true but pruning_config is not specified, default values will be used.'
              x-state: Generally available; Added in 8.15.0
              allOf:
              - $ref: '#/components/schemas/_types.TokenPruningConfig'
          required:
          - field
        - type: object
          properties:
            query_vector:
              description: 'Dictionary of precomputed sparse vectors and their associated weights.

                Only one of inference_id or query_vector may be supplied in a request.'
              type: object
              additionalProperties:
                type: number
            inference_id:
              description: 'The inference ID to use to convert the query text into token-weight pairs.

                It must be the same inference ID that was used to create the tokens from the input text.

                Only one of inference_id and query_vector is allowed.

                If inference_id is specified, query must also be specified.

                Only one of inference_id or query_vector may be supplied in a request.'
              allOf:
              - $ref: '#/components/schemas/_types.Id'
          minProperties: 1
          maxProperties: 1
