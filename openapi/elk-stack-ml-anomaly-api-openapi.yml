      properties:
        detector_index:
          description: 'A unique identifier for the detector.

            This identifier is based on the order of the detectors in the `analysis_config`, starting at zero.'
          type: number
        description:
          description: A description of the detector.
          type: string
        custom_rules:
          description: 'An array of custom rule objects, which enable you to customize the way detectors operate.

            For example, a rule may dictate to the detector conditions under which results should be skipped.

            Kibana refers to custom rules as job rules.'
          type: array
          items:
            $ref: '#/components/schemas/ml._types.DetectionRule'
      required:
      - detector_index
    _types.analysis.KuromojiTokenizer:
      allOf:
      - $ref: '#/components/schemas/_types.analysis.TokenizerBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - kuromoji_tokenizer
          discard_punctuation:
            type: boolean
          mode:
            allOf:
            - $ref: '#/components/schemas/_types.analysis.KuromojiTokenizationMode'
          nbest_cost:
            type: number
          nbest_examples:
            type: string
          user_dictionary:
            type: string
          user_dictionary_rules:
            type: array
            items:
              type: string
          discard_compound_token:
            type: boolean
        required:
        - type
        - mode
    _types.analysis.NGramTokenizer:
      allOf:
      - $ref: '#/components/schemas/_types.analysis.TokenizerBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - ngram
          custom_token_chars:
            type: string
          max_gram:
            type: number
          min_gram:
            type: number
          token_chars:
            default: []
            type: array
            items:
              $ref: '#/components/schemas/_types.analysis.TokenChar'
        required:
        - type
    _types.analysis.KuromojiTokenizationMode:
      type: string
      enum:
      - normal
      - search
      - extended
    _types.analysis.StemmerTokenFilter:
      allOf:
      - $ref: '#/components/schemas/_types.analysis.TokenFilterBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - stemmer
          language:
            type: string
        required:
        - type
    _types.analysis.CommonGramsTokenFilter:
      allOf:
      - $ref: '#/components/schemas/_types.analysis.TokenFilterBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - common_grams
          common_words:
            description: 'A list of tokens. The filter generates bigrams for these tokens.

              Either this or the `common_words_path` parameter is required.'
            type: array
            items:
              type: string
          common_words_path:
            description: 'Path to a file containing a list of tokens. The filter generates bigrams for these tokens.

              This path must be absolute or relative to the `config` location. The file must be UTF-8 encoded. Each token in the file must be separated by a line break.

              Either this or the `common_words` parameter is required.'
            type: string
          ignore_case:
            description: If `true`, matches for common words matching are case-insensitive. Defaults to `false`.
            type: boolean
          query_mode:
            description: 'If `true`, the filter excludes the following tokens from the output:

              - Unigrams for common words

              - Unigrams for terms followed by common words

              Defaults to `false`. We recommend enabling this parameter for search analyzers.'
            type: boolean
        required:
        - type
    _types.query_dsl.DecayFunction:
      oneOf:
      - $ref: '#/components/schemas/_types.query_dsl.UntypedDecayFunction'
      - $ref: '#/components/schemas/_types.query_dsl.DateDecayFunction'
      - $ref: '#/components/schemas/_types.query_dsl.NumericDecayFunction'
      - $ref: '#/components/schemas/_types.query_dsl.GeoDecayFunction'
    _types.query_dsl.PrefixQuery:
      allOf:
      - $ref: '#/components/schemas/_types.query_dsl.QueryBase'
      - type: object
        properties:
          rewrite:
            description: Method used to rewrite the query.
            allOf:
            - $ref: '#/components/schemas/_types.MultiTermQueryRewrite'
          value:
            description: Beginning characters of terms you wish to find in the provided field.
            type: string
          case_insensitive:
            description: 'Allows case insensitive matching of the value with the indexed field values when set to `true`.

              Default is `false` which means the case sensitivity of matching depends on the underlying field’s mapping.'
            default: false
            x-state: Generally available; Added in 7.10.0
            type: boolean
        required:
        - value
    _types.analysis.IcuCollationDecomposition:
      type: string
      enum:
      - 'no'
      - identical
    _global.search._types.SourceConfig:
      description: Defines how to fetch a source. Fetching can be disabled entirely, or the source can be filtered.
      oneOf:
      - type: boolean
      - $ref: '#/components/schemas/_global.search._types.SourceFilter'
    _global.search._types.HighlightBase:
      type: object
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/_global.search._types.HighlighterType'
        boundary_chars:
          description: A string that contains each boundary character.
          default: .,!? \t\n
          type: string
        boundary_max_scan:
          description: How far to scan for boundary characters.
          default: 20.0
          type: number
        boundary_scanner:
          description: 'Specifies how to break the highlighted fragments: chars, sentence, or word.

            Only valid for the unified and fvh highlighters.

            Defaults to `sentence` for the `unified` highlighter. Defaults to `chars` for the `fvh` highlighter.'
          allOf:
          - $ref: '#/components/schemas/_global.search._types.BoundaryScanner'
        boundary_scanner_locale:
          description: 'Controls which locale is used to search for sentence and word boundaries.

            This parameter takes a form of a language tag, for example: `"en-US"`, `"fr-FR"`, `"ja-JP"`.'
          default: Locale.ROOT
          type: string
        force_source:
          deprecated: true
          type: boolean
        fragmenter:
          description: 'Specifies how text should be broken up in highlight snippets: `simple` or `span`.

            Only valid for the `plain` highlighter.'
          default: span
          allOf:
          - $ref: '#/components/schemas/_global.search._types.HighlighterFragmenter'
        fragment_size:
          description: The size of the highlighted fragment in characters.
          default: 100.0
          type: number
        highlight_filter:
          type: boolean
        highlight_query:
          description: 'Highlight matches for a query other than the search query.

            This is especially useful if you use a rescore query because those are not taken into account by highlighting by default.'
          allOf:
          - $ref: '#/components/schemas/_types.query_dsl.QueryContainer'
        max_fragment_length:
          type: number
        max_analyzed_offset:
          description: 'If set to a non-negative value, highlighting stops at this defined maximum limit.

            The rest of the text is not processed, thus not highlighted and no error is returned

            The `max_analyzed_offset` query setting does not override the `index.highlight.max_analyzed_offset` setting, which prevails when it’s set to lower value than the query setting.'
          type: number
        no_match_size:
          description: The amount of text you want to return from the beginning of the field if there are no matching fragments to highlight.
          default: 0.0
          type: number
        number_of_fragments:
          description: 'The maximum number of fragments to return.

            If the number of fragments is set to `0`, no fragments are returned.

            Instead, the entire field contents are highlighted and returned.

            This can be handy when you need to highlight short texts such as a title or address, but fragmentation is not required.

            If `number_of_fragments` is `0`, `fragment_size` is ignored.'
          default: 5.0
          type: number
        options:
          type: object
          additionalProperties:
            type: object
        order:
          description: 'Sorts highlighted fragments by score when set to `score`.

            By default, fragments will be output in the order they appear in the field (order: `none`).

            Setting this option to `score` will output the most relevant fragments first.

            Each highlighter applies its own logic to compute relevancy scores.'
          default: none
          allOf:
          - $ref: '#/components/schemas/_global.search._types.HighlighterOrder'
        phrase_limit:
          description: 'Controls the number of matching phrases in a document that are considered.

            Prevents the `fvh` highlighter from analyzing too many phrases and consuming too much memory.

            When using `matched_fields`, `phrase_limit` phrases per matched field are considered. Raising the limit increases query time and consumes more memory.

            Only supported by the `fvh` highlighter.'
          default: 256.0
          type: number
        post_tags:
          description: 'Use in conjunction with `pre_tags` to define the HTML tags to use for the highlighted text.

            By default, highlighted text is wrapped in `<em>` and `</em>` tags.'
          type: array
          items:
            type: string
        pre_tags:
          description: 'Use in conjunction with `post_tags` to define the HTML tags to use for the highlighted text.

            By default, highlighted text is wrapped in `<em>` and `</em>` tags.'
          type: array
          items:
            type: string
        require_field_match:
          description: 'By default, only fields that contains a query match are highlighted.

            Set to `false` to highlight all fields.'
          default: true
          type: boolean
        tags_schema:
          description: Set to `styled` to use the built-in tag schema.
          allOf:
          - $ref: '#/components/schemas/_global.search._types.HighlighterTagsSchema'
    _types.DurationLarge:
      description: 'A date histogram interval. Similar to `Duration` with additional units: `w` (week), `M` (month), `q` (quarter) and

        `y` (year)'
      type: string
    _types.LatLonGeoLocation:
      type: object
      properties:
        lat:
          description: Latitude
          type: number
        lon:
          description: Longitude
          type: number
      required:
      - lat
      - lon
    _types.analysis.UaxEmailUrlTokenizer:
      allOf:
      - $ref: '#/components/schemas/_types.analysis.TokenizerBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - uax_url_email
          max_token_length:
            type: number
        required:
        - type
    _types.aggregations.NormalizeMethod:
      type: string
      enum:
      - rescale_0_1
      - rescale_0_100
      - percent_of_sum
      - mean
      - z-score
      - softmax
    _types.aggregations.PercentilesAggregation:
      allOf:
      - $ref: '#/components/schemas/_types.aggregations.FormatMetricAggregationBase'
      - type: object
        properties:
          keyed:
            description: 'By default, the aggregation associates a unique string key with each bucket and returns the ranges as a hash rather than an array.

              Set to `false` to disable this behavior.'
            default: true
            type: boolean
          percents:
            description: The percentiles to calculate.
            oneOf:
            - type: number
            - type: array
              items:
                type: number
          hdr:
            description: Uses the alternative High Dynamic Range Histogram algorithm to calculate percentiles.
            allOf:
            - $ref: '#/components/schemas/_types.aggregations.HdrMethod'
          tdigest:
            description: Sets parameters for the default TDigest algorithm used to calculate percentiles.
            allOf:
            - $ref: '#/components/schemas/_types.aggregations.TDigest'
    _types.analysis.IcuNormalizationTokenFilter:
      allOf:
      - $ref: '#/components/schemas/_types.analysis.TokenFilterBase'
      - type: object
        properties:
          type:
            type: string
            enum:
            - icu_normalizer
          name:
            allOf:
            - $ref: '#/components/schemas/_types.analysis.IcuNormalizationType'
        required:
        - type
        - name
    _types.aggregations.VariableWidthHistogramAggregation:
      type: object
      properties:
        field:
          description: The name of the field.
          allOf:
          - $ref: '#/components/schemas/_types.Field'
        buckets:
          description: The target number of buckets.
          default: 10.0
          type: number
        shard_size:
          description: 'The number of buckets that the coordinating node will request from each shard.

            Defaults to `buckets * 50`.'
          type: number
        initial_buffer:
          description: 'Specifies the number of individual documents that will be stored in memory on a shard before the initial bucketing algorithm is run.

            Defaults to `min(10 * shard_size, 50000)`.'
          type: number
        script:
          allOf:
          - $ref: '#/components/schemas/_types.Script'
    _types.aggregations.RateAggregation:
      allOf:
      - $ref: '#/components/schemas/_types.aggregations.FormatMetricAggregationBase'
      - type: object
        properties:
          unit:
            description: 'The interval used to calculate the rate.

              By default, the interval of the `date_histogram` is used.'
            allOf:
            - $ref: '#/components/schemas/_types.aggregations.CalendarInterval'
          mode:
            description: How the rate is calculated.
            default: sum
            allOf:
            - $ref: '#/components/schemas/_types.aggregations.RateMode'
    _types.aggregations.CategorizeTextAggregation:
      description: 'A multi-bucket aggregation that groups semi-structured text into buckets. Each text

        field is re-analyzed using a custom analyzer. The resulting tokens are then categorized

        creating buckets of similarly formatted text values. This aggregation works best with machine

        generated text like system logs. Only the first 100 analyzed tokens are used to categorize the text.'
      allOf:
      - $ref: '#/components/schemas/_types.aggregations.Aggregation'
      - type: object
        properties:
          field:
            description: The semi-structured text field to categorize.
            allOf:
            - $ref: '#/components/schemas/_types.Field'
          max_unique_tokens:
            description: 'The maximum number of unique tokens at any position up to max_matched_tokens. Must be larger than 1.

              Smaller values use less memory and create fewer categories. Larger values will use more memory and

              create narrower categories. Max allowed value is 100.'
            default: 50.0
            type: number
          max_matched_tokens:
            description: 'The maximum number of token positions to match on before attempting to merge categories. Larger

              values will use more memory and create narrower categories. Max allowed value is 100.'
            default: 5.0
            type: number
          similarity_threshold:
            description: 'The minimum percentage of tokens that must match for text to be added to the category bucket. Must

              be between 1 and 100. The larger the value the narrower the categories. Larger values will increase memory

              usage and create narrower categories.'
            default: 50.0
            type: number
          categorization_filters:
            description: 'This property expects an array of regular expressions. The expressions are used to filter out matching

              sequences from the categorization field values. You can use this functionality to fine tune the categorization

              by excluding sequences from consideration when categories are defined. For example, you can exclude SQL

              statements that appear in your log files. This property cannot be used at the same time as categorization_analyzer.

              If you only want to define simple regular expression filters that are applied prior to tokenization, setting

              this property is the easiest method. If you also want to customize the tokenizer or post-tokenization filtering,

              use the categorization_analyzer property instead and include the filters as pattern_replace character filters.'
            type: array
            items:
              type: string
          categorization_analyzer:
            externalDocs:
              url: https://www.elastic.co/docs/api/doc/elasticsearch/operation/operation-indices-analyze
            description: 'The categorization analyzer specifies how the text is analyzed and tokenized before being categorized.

              The syntax is very similar to that used to define the analyzer in the analyze API. This property

              cannot be used at the same time as `categorization_filters`.'
            allOf:
            - $ref: '#/components/schemas/_types.aggregations.CategorizeTextAnalyzer'
          shard_size:
            description: The number of categorization buckets to return from each shard before merging all the results.
            type: number
          size:
            description: The number of buckets to return.
            default: 10.0
            type: number
          min_doc_count:
            description: The minimum number of documents in a bucket to be returned to the results.
            type: number
          shard_min_doc_count:
            description: The minimum number of documents in a bucket to be returned from the shard before merging.
            type: number
        required:
        - field
    _types.query_dsl.IntervalsFilter:
      type: object
      properties:
        after:
          description: Query used to return intervals that follow an interval from the `filter` rule.
          allOf:
          - $ref: '#/components/schemas/_types.query_dsl.IntervalsContainer'
        before:
          description: Query used to return intervals that occur before an interval from the `filter` rule.
          allOf:
          - $ref: '#/components/schemas/_types.query_dsl.IntervalsContainer'
        contained_by:
          description: Query used to return intervals contained by an interval from the `filter` rule.
          allOf:
          - $ref: '#/components/schemas/_types.query_dsl.IntervalsContainer'
        containing:
          description: Query used to return intervals that contain an interval from the `filter` rule.
          allOf:
          - $ref: '#/components/schemas/_types.query_dsl.IntervalsContainer'
        not_contained_by:
          description: Query used to return intervals that are **not** contained by an interval from the `filter` rule.
          allOf:
          - $ref: '#/components/schemas/_types.query_dsl.IntervalsContainer'
        not_containing:
          description: Query used to return intervals that do **not** contain an interval from the `filter` rule.
          allOf:
          - $ref: '#/components/schemas/_types.query_dsl.IntervalsContainer'
        not_overlapping:
          description: Query used to return intervals that do **not** overlap with an interval from the `filter` rule.
          allOf:
          - $ref: '#/components/schemas/_types.query_dsl.IntervalsContainer'
        overlapping:
          description: Query used to return intervals that overlap with an interval from the `filter` rule.
          allOf:
          - $ref: '#/components/schemas/_types.query_dsl.IntervalsContainer'
        script:
          description: 'Script used to return matching documents.

            This script must return a boolean value: `true` or `false`.'
          allOf:
          - $ref: '#/components/schemas/_types.Script'
      minProperties: 1
      maxProperties: 1
    _types.aggregations.TestPopulation:
      type: object
      properties:
        field:
          description: The field to aggregate.
          allOf:
          - $ref: '#/components/schemas/_types.Field'
        script:
          allOf:
