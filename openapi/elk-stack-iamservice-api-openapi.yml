          description: The date and time when the user last logged in
      description: Metadata for a user
    AuthenticationInfo:
      type: object
      required:
      - has_elevated_permissions
      - refresh_token_url
      properties:
        has_totp_device:
          type: boolean
          description: 'Deprecated: True if the user has an available TOTP device'
        totp_device_source:
          type: string
          description: 'Deprecated: The TOTP device source'
        has_elevated_permissions:
          type: boolean
          description: 'Deprecated: True if the user has elevated permissions'
        elevated_permissions_expire_at:
          type: string
          format: date-time
          description: 'Deprecated: The UTC time when elevated permissions will expire, if the user has elevated permissions'
        totp_device_source_enable_mfa_href:
          type: string
          description: 'Deprecated: URL for configuring an MFA TOTP device.  Does not apply when totp_device_source is ''native''.'
        refresh_token_url:
          type: string
          description: The API to be used when refreshing the current user's JWT
        expires_at:
          type: string
          format: date-time
          description: The UTC time when current authentication will expire. Applies to only token based authentication
      description: A user's authentication info
    UserApiKey:
      type: object
      required:
      - api_key_id
      - user_id
      properties:
        user_id:
          type: string
          description: The user ID.
        api_key_id:
          type: string
          description: The API key ID.
      description: The model to specify a user and their API key in a delete request.
    OrganizationMembership:
      type: object
      required:
      - member_since
      - organization_id
      - user_id
      properties:
        organization_id:
          type: string
          description: The organization's identifier
        user_id:
          type: string
          description: The users's identifier
        name:
          type: string
          description: The user's full name
        email:
          type: string
          description: The user's email address
        member_since:
          type: string
          format: date-time
          description: The date and time the user was added to the organization
        role_assignments:
          description: The user's assigned roles. Currently unavailable in self-hosted ECE.
          $ref: '#/components/schemas/RoleAssignments'
      description: A user's membership to an organization
    EmptyResponse:
      type: object
    UpdateOrganizationRoleMappingRequest:
      type: object
      required:
      - mappings
      properties:
        mappings:
          type: array
          description: The rules for mapping role assignments in the organization
          items:
            $ref: '#/components/schemas/RoleMapping'
    LoginRequest:
      type: object
      required:
      - password
      - username
      properties:
        username:
          type: string
          description: The username part of the login request
        password:
          type: string
          description: The plain text password part of the login request
        login_state:
          $ref: '#/components/schemas/LoginState'
      description: The body of a login request.
    GetOrganizationClaimedDomainsResponse:
      type: object
      required:
      - domains
      properties:
        domains:
          type: array
          description: The list of claimed domains in the organization
          items:
            type: string
    PlatformRoleAssignment:
      type: object
      required:
      - role_id
      properties:
        role_id:
          type: string
          description: The ID of the role that is assigned.
      description: Assignment for a role with platform scope.
    DeploymentRoleAssignment:
      type: object
      required:
      - organization_id
      - role_id
      properties:
        role_id:
          type: string
          description: The ID of the role that is assigned.
        organization_id:
          type: string
          description: The ID of the organization the role is scoped to.
        all:
          type: boolean
          description: When true, the role applies to all deployments in the organization, otherwise the role is scoped to the deployments specified in `deployment_ids`.
        deployment_ids:
          type: array
          description: The IDs of the deployments the role is scoped to. Must be absent if `all` is true, and present if `all` is false.
          items:
            type: string
        application_roles:
          type: array
          description: If provided, the user assigned this role assignment will be granted this application role when signing in to the deployment(s) specified in the role assignment.
          items:
            type: string
      description: Assignment for a role with deployment scope.
    RoleAssignments:
      type: object
      properties:
        platform:
          type: array
          description: Assignments for roles with platform scope.
          items:
            $ref: '#/components/schemas/PlatformRoleAssignment'
        organization:
          type: array
          description: Assignments for roles with organization scope.
          items:
            $ref: '#/components/schemas/OrganizationRoleAssignment'
        deployment:
          type: array
          description: Assignments for roles with deployment scope.
          items:
            $ref: '#/components/schemas/DeploymentRoleAssignment'
        project:
          description: Assignments for roles with project scope.
          $ref: '#/components/schemas/ProjectRoleAssignments'
      description: Roles assigned to users, API keys or organization invitations. Currently unavailable in self-hosted ECE.
    ElevatedPermissions:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: True if the user has elevated permissions
        expires_at:
          type: string
          format: date-time
          description: The time at which the user's elevated permissions expire
      description: A user's elevated permissions status
    OrganizationMemberships:
      type: object
      required:
      - members
      properties:
        members:
          type: array
          description: The list of organization memberships
          items:
            $ref: '#/components/schemas/OrganizationMembership'
      description: All user memberships to an organization
    UserList:
      type: object
      required:
      - users
      properties:
        users:
          type: array
          description: A list of users
          items:
            $ref: '#/components/schemas/User'
      description: A collection of users
    LoginState:
      type: object
      properties:
        path:
          type: string
          description: The path to which to redirect post login - if not specified then no redirect is performed, instead 200 is returned with the token in the body
      description: Configure how the API responds after a successful login.
    ApiKeyResponse:
      type: object
      required:
      - creation_date
      - description
      - id
      properties:
        id:
          type: string
          description: The API key ID.
        user_id:
          type: string
          description: The user ID.
        organization_id:
          type: string
          description: The organization ID linked to the API key
        description:
          type: string
          description: 'The API key description. TIP: Useful when you have multiple API keys.'
        key:
          type: string
          description: 'The API key. TIP: Since the API key is returned only once, save it in a safe place.'
        creation_date:
          type: string
          format: date-time
          description: The date/time for when the API key is created.
        expiration_date:
          type: string
          format: date-time
          description: The date/time when the API key expires.
        role_assignments:
          description: The optional roles for the API key. Currently unavailable in self-hosted ECE.
          $ref: '#/components/schemas/RoleAssignments'
      description: The response model for an API key.
    ProjectRoleAssignments:
      type: object
      properties:
        elasticsearch:
          type: array
          description: The Elasticsearch project-scoped role assignments to set
          items:
            $ref: '#/components/schemas/ProjectRoleAssignment'
        observability:
          type: array
          description: The Observability project-scoped role assignments to set
          items:
            $ref: '#/components/schemas/ProjectRoleAssignment'
        security:
          type: array
          description: The Security project-scoped role assignments to set
          items:
            $ref: '#/components/schemas/ProjectRoleAssignment'
        workplaceai:
          type: array
          description: The WorkplaceAI project-scoped role assignments to set
          items:
            $ref: '#/components/schemas/ProjectRoleAssignment'
        vectordb:
          type: array
          description: The VectorDB project-scoped role assignments to set
          items:
            $ref: '#/components/schemas/ProjectRoleAssignment'
      description: Assignments for roles with project scope.
    User:
      type: object
      required:
      - security
      - user_name
      properties:
        user_name:
          type: string
          description: The user's identifier
        security:
          description: The user's security information
          $ref: '#/components/schemas/UserSecurity'
        metadata:
          description: The users metadata
          $ref: '#/components/schemas/UserMetadata'
        full_name:
          type: string
          description: The user's optional full name
        email:
          type: string
          description: The user's optional email address
        builtin:
          type: boolean
          description: True if the user is a built-in read-only user
      description: An API user
    DeleteUsersApiKeysRequest:
      type: object
      required:
      - user_api_keys
      properties:
        user_api_keys:
          type: array
          description: The list of API key IDs.
          items:
            $ref: '#/components/schemas/UserApiKey'
      description: The request payload that deletes the API keys.
    BasicFailedReply:
      type: object
      required:
      - errors
      properties:
        errors:
          type: array
          description: A list of errors that occurred in the failing request
          items:
            $ref: '#/components/schemas/BasicFailedReplyElement'
    DeleteApiKeysRequest:
      type: object
      required:
      - keys
      properties:
        keys:
          type: array
          description: The list of API key IDs.
          items:
            type: string
      description: The request payload that deletes the API keys.
    TokenResponse:
      type: object
      required:
      - session_expiration_time
      - token
      properties:
        token:
          type: string
          description: The authorization bearer token that you use in subsequent requests
        session_expiration_time:
          type: string
          format: date-time
          description: The time that the session token will expire
      description: The response value after a login without redirect configured, or after elevated permissions are enabled or disabled.
    OrganizationIdp:
      type: object
      required:
      - acs
      - configuration
      - encryption_certificate
      - login_identifier
      - metadata_url
      - signing_certificate
      - sp_entity_id
      - sso_login_url
      properties:
        login_identifier:
          type: string
          description: The login identifier that is unique to this organization
        sso_login_url:
          type: string
          description: The Elastic Cloud login URL for this IdP
        metadata_url:
          type: string
          description: The SAML2 metadata url for downloading the SAML2 SP metadata XML
        acs:
          type: string
          description: The SAML2 assertion consumer service of the SP
        sp_entity_id:
          type: string
          description: The SP entity ID and the audience for SAML2 response assertions
        signing_certificate:
          type: array
          description: The certificate that will sign SAML2 requests to the IdP
          items:
            type: string
        encryption_certificate:
          type: array
          description: The certificate that the IdP can use to encrypt SAML assertions. Encryption is optional
          items:
            type: string
        configuration:
          description: The organization's IdP configuration
          $ref: '#/components/schemas/OrganizationIdpConfiguration'
      description: The organization's IdP info
    OrganizationList:
      type: object
      required:
      - organizations
      properties:
        organizations:
          type: array
          description: The list of organizations
          items:
            $ref: '#/components/schemas/Organization'
        next_page:
          type: string
          description: A cursor to get the next page of results
      description: A collection of Organizations
    UserSecurity:
      type: object
      properties:
        roles:
          type: array
          description: The set of roles assigned to a user
          items:
            type: string
        permissions:
          type: array
          description: The distinct set of permissions allowed by the user's roles. These correspond to operationId values in the OpenAPI definition.
          items:
            type: string
        elevated_permissions:
          description: The user's elevated permission status
          $ref: '#/components/schemas/ElevatedPermissions'
        password:
          type: string
          description: The user's password. Only used when modifying a user.
        enabled:
          type: boolean
          description: True if the user is enabled
        security_realm:
          description: The user's security realm
          $ref: '#/components/schemas/UserSecurityRealm'
      description: A user's security information
    SsoAuthenticationMethodInfo:
      type: object
      required:
      - name
      - sso_type
      - url
      properties:
        sso_type:
          type: string
          description: Indicates the protocol of the single sign-on method.
          enum:
          - saml
        name:
          type: string
          description: The friendly name of the single sign-on method.
        url:
          type: string
          description: The URL to initiate the single sign-on login.
      description: 'Specifies the authentication methods that are enabled on the Elasticsearch cluster. NOTE: When all fields are `false`, only the Platform admin and Platform viewer are available.'
    DomainVerificationRequest:
      type: object
      required:
      - domain_claim_request
      properties:
        domain_claim_request:
          type: string
          description: The domain claim request
    GetRoleMappingsResponse:
      type: object
      required:
      - mappings
      properties:
        mappings:
          type: array
          description: The list of role assignments for the organization
          items:
            $ref: '#/components/schemas/RoleMapping'
    VerificationCodeResponse:
      type: object
      required:
      - verification
      properties:
        verification:
          type: string
          description: The verification code to use for the domain claim challenge
  securitySchemes:
    apiKey:
      type: apiKey
      name: Authorization
      in: header
    basicAuth:
      type: http
      scheme: basic
x-elastic:
  curl:
    auth: '-H "Authorization: ApiKey $ECE_API_KEY"'
