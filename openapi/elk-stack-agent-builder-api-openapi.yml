  /api/agent_builder/agents/{id}/access_control:
    get:
      description: '**Spaces method and path for this operation:**


        <div><span class="operation-verb get">get</span>&nbsp;<span class="operation-path">/s/{space_id}/api/agent_builder/agents/{id}/access_control</span></div>


        Refer to [Spaces](https://www.elastic.co/docs/deploy-manage/manage-spaces) for more information.


        Get the access control for a specific agent. Callers without permission to manage access control receive `permissions.update_access_control: false` and only their own entry. To learn more about agents, refer to the [agents documentation](https://www.elastic.co/docs/explore-analyze/ai-features/agent-builder/agent-builder-agents).<br/><br/>[Required authorization] Route required privileges: agentBuilder:read.'
      operationId: get-agent-builder-agents-id-access-control
      parameters:
      - description: The unique identifier of the agent whose access control to retrieve.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                getAgentAccessControlMaskedResponseExample:
                  description: Example response for a caller without manage permission — only the caller's own entry is returned.
                  value:
                    access_control:
                      access_mode: private
                      entries:
                      - name: bob
                        role: user
                        type: user
                    permissions:
                      update_access_control: false
                getAgentAccessControlResponseExample:
                  description: Example response for a caller who can manage access control — the agent has two grantees.
                  value:
                    access_control:
                      access_mode: private
                      entries:
                      - name: alice
                        role: editor
                        type: user
                      - name: bob
                        role: user
                        type: user
                    permissions:
                      update_access_control: true
          description: Indicates a successful response
        '404':
          content:
            application/json:
              examples:
                agentNotFoundResponseExample:
                  value:
                    attributes:
                      trace_id: 8d4f2a3b-1c5e-4a9b-9f0d-2e6c1a3d4f5e
                    error: Not Found
                    message: Agent custom-agent-id not found
                    statusCode: 404
          description: Not Found — no agent with this ID is visible to the caller. Matches the existing `agentNotFound` shape, so unprivileged callers cannot probe for hidden agents.
      summary: Get an agent's access control list
      tags:
      - agent builder
      x-codeSamples:
      - lang: curl
        source: "curl \\\n  -X GET \"${KIBANA_URL}/api/agent_builder/agents/{id}/access_control\" \\\n  -H \"Authorization: ApiKey ${API_KEY}\"\n"
