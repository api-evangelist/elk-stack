        Refer to [Spaces](https://www.elastic.co/docs/deploy-manage/manage-spaces) for more information.


        Replace the per-agent access-control entries. The agent owner, cluster admins, and anyone access control grants Manager can call this endpoint. Each call replaces the entire entries list — the most recent successful update wins. To learn more about agents, refer to the [agents documentation](https://www.elastic.co/docs/explore-analyze/ai-features/agent-builder/agent-builder-agents).<br/><br/>[Required authorization] Route required privileges: agentBuilder:manageAgents.'
      operationId: put-agent-builder-agents-id-access-control
      parameters:
      - description: A required header to protect against CSRF attacks
        in: header
        name: kbn-xsrf
        required: true
        schema:
          example: 'true'
          type: string
      - description: The unique identifier of the agent whose access control to update.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              clearAgentAccessControlRequestExample:
                description: Submit an empty entries list to remove all custom grants. Access then falls back to the agent's access-control mode.
                value:
                  entries: []
              updateAgentAccessControlRequestExample:
                description: Example request granting two users access to the agent — Alice as Editor (can update the agent and its access control), Bob as User (can run the agent).
                value:
                  entries:
                  - name: alice
                    role: editor
                    type: user
                  - name: bob
                    role: user
                    type: user
            schema:
              additionalProperties: false
              type: object
              properties:
                entries:
                  description: Access-control entries to apply to the agent. Each entry has a `type` (currently only `user` is supported), a `name` (the principal username), and a `role`.
                  items:
                    additionalProperties: false
                    type: object
                    properties:
                      name:
                        description: Case-sensitive Kibana username of the principal to grant access to.
                        maxLength: 1024
                        minLength: 1
                        type: string
                      role:
                        description: 'Role granted to the principal. Roles are hierarchical: `user` allows viewing, listing, reading, and running the agent; `editor` adds updating the agent and its access control; `manager` adds deleting the agent and managing access control.'
                        enum:
                        - user
                        - editor
                        - manager
                        type: string
                      type:
                        enum:
                        - user
                        type: string
                    required:
                    - type
                    - name
                    - role
                  maxItems: 100
                  type: array
              required:
              - entries
      responses:
        '200':
          content:
            application/json:
              examples:
                updateAgentAccessControlResponseExample:
                  description: Example response returning the persisted access control after the update.
                  value:
                    access_mode: private
                    entries:
                    - name: alice
                      role: editor
                      type: user
                    - name: bob
                      role: user
                      type: user
          description: Indicates a successful response
        '400':
          content:
            application/json:
              examples:
                accessControlOnDefaultAgentResponseExample:
                  description: The built-in Elastic default agent (`elastic-ai-agent`) cannot have custom access control — its access is governed by the platform, not per-agent grants.
                  value:
                    attributes:
                      trace_id: 8d4f2a3b-1c5e-4a9b-9f0d-2e6c1a3d4f5e
                    error: Bad Request
                    message: The default agent (elastic-ai-agent) does not support custom access controls.
                    statusCode: 400
                tooManyEntriesResponseExample:
                  description: Request body exceeds the 100-entry maximum.
                  value:
                    error: Bad Request
                    message: '[request body.entries]: array size is [101], but cannot be greater than [100]'
                    statusCode: 400
          description: Bad Request — the request body failed validation, or the request targets the built-in Elastic default agent (which cannot have custom access control).
        '404':
          content:
            application/json:
              examples:
                agentNotFoundResponseExample:
                  value:
                    attributes:
                      trace_id: 8d4f2a3b-1c5e-4a9b-9f0d-2e6c1a3d4f5e
                    error: Not Found
                    message: Agent custom-agent-id not found
                    statusCode: 404
          description: Not Found — no agent with this ID is visible to the caller, or the caller lacks write access. Matches the existing `agentNotFound` shape so unprivileged callers cannot probe for hidden agents.
      summary: Update an agent's access control list
      tags:
      - agent builder
      x-codeSamples:
      - lang: curl
        source: "curl \\\n  -X PUT \"${KIBANA_URL}/api/agent_builder/agents/{id}/access_control\" \\\n  -H \"Authorization: ApiKey ${API_KEY}\" \\\n  -H \"kbn-xsrf: true\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"entries\": [\n      { \"type\": \"user\", \"name\": \"alice\", \"role\": \"editor\" },\n      { \"type\": \"user\", \"name\": \"bob\", \"role\": \"user\" }\n    ]\n  }'\n"
      - lang: Console
        source: "PUT kbn://api/agent_builder/agents/{id}/access_control\n{\n  \"entries\": [\n    { \"type\": \"user\", \"name\": \"alice\", \"role\": \"editor\" },\n    { \"type\": \"user\", \"name\": \"bob\", \"role\": \"user\" }\n  ]\n}\n"
