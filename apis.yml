aid: elk-stack
name: Elastic Stack (ELK Stack)
description: >-
  The Elastic Stack (formerly known as the ELK Stack) is the collection of
  open-source products from Elastic — Elasticsearch, Logstash, Kibana, and
  Beats/Elastic Agent — designed for taking data from any source, in any
  format, and searching, analyzing, and visualizing it in real time. It is
  widely used for log management, observability, security analytics (SIEM),
  and increasingly as a vector database and retrieval layer for RAG and
  agentic AI applications. Elastic publishes machine-readable OpenAPI
  descriptions for all three of its programmable surfaces: the Elasticsearch
  REST API, the Kibana APIs, and the Elastic Cloud control-plane API. The
  stack is deployment-hosted — self-managed, Elastic Cloud Hosted, or Elastic
  Cloud Serverless — so the Elasticsearch and Kibana base URLs are always
  specific to the customer's own cluster or project.
