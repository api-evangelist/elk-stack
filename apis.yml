aid: elk-stack
name: Elastic Stack (ELK Stack)
description: >-
  The Elastic Stack (formerly known as the ELK Stack) is a collection of
  open-source products from Elastic - Elasticsearch, Logstash, Kibana, and
  Beats - designed for taking data from any source, in any format, and
  searching, analyzing, and visualizing it in real time. Widely used for log
  management, observability, and security analytics.
