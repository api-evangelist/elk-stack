- aid: elk-stack:elasticsearch-api
  name: Elasticsearch REST API
  description: >-
    The Elasticsearch REST API is the programmable surface of the distributed
    search, analytics and vector engine at the heart of the Elastic Stack —
    581 paths and 845 operations covering indices, documents, search, ES|QL,
    inference, machine learning, security, snapshots, ingest pipelines,
    connectors, transforms, ILM/SLM and cluster administration. Elastic
    publishes it as OpenAPI 3.0.3 generated from the canonical
    elasticsearch-specification repository.
  humanURL: https://www.elastic.co/docs/api/doc/elasticsearch/
  baseURL: https://{elasticsearch_endpoint}
