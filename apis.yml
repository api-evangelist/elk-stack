name: Elastic Stack (ELK Stack)
description: 'The Elastic Stack (formerly known as ELK Stack) is a collection of open-source  products - Elasticsearch, Logstash, and Kibana - designed for taking data from  any source, in any format, and searching, analyzing, and visualizing it in real time.

  '
image: https://www.elastic.co/static/images/elastic-logo-200.png
created: '2024'
modified: '2024'
specificationVersion: '0.18'
url: https://www.elastic.co/apis.json
tags:
- Search
- Analytics
- Logging
- Monitoring
- Observability
- Security
apis:
- name: Elasticsearch API
  description: 'Distributed, RESTful search and analytics engine capable of addressing a  growing number of use cases. Serves as the heart of the Elastic Stack for  centralized storage and search.

    '
  image: https://www.elastic.co/static/images/elasticsearch-logo.png
  humanURL: https://www.elastic.co/elasticsearch/
  baseURL: https://localhost:9200
  tags:
  - Search
  - Database
  - Analytics
  - NoSQL
  properties:
  - type: Documentation
    url: https://www.elastic.co/guide/en/elasticsearch/reference/current/index.html
  - type: OpenAPI
    url: https://raw.githubusercontent.com/elastic/elasticsearch-specification/main/output/openapi/elasticsearch-serverless-openapi.json
  - type: API Reference
    url: https://www.elastic.co/guide/en/elasticsearch/reference/current/rest-apis.html
  - type: Getting Started
    url: https://www.elastic.co/guide/en/elasticsearch/reference/current/getting-started.html
  - type: Client Libraries
    url: https://www.elastic.co/guide/en/elasticsearch/client/index.html
- name: Kibana API
  description: 'Data visualization and exploration tool for reviewing logs and events.  Provides real-time histograms, line graphs, pie charts, and maps for  Elasticsearch data.

    '
  image: https://www.elastic.co/static/images/kibana-logo.png
  humanURL: https://www.elastic.co/kibana/
  baseURL: https://localhost:5601
  tags:
  - Visualization
  - Dashboard
  - Analytics
  - Monitoring
  properties:
  - type: Documentation
    url: https://www.elastic.co/guide/en/kibana/current/index.html
  - type: API Reference
    url: https://www.elastic.co/guide/en/kibana/current/api.html
  - type: Saved Objects API
    url: https://www.elastic.co/guide/en/kibana/current/saved-objects-api.html
  - type: Alerting API
    url: https://www.elastic.co/guide/en/kibana/current/alerting-apis.html
  - type: Spaces API
    url: https://www.elastic.co/guide/en/kibana/current/spaces-api.html
- name: Logstash
  description: 'Server-side data processing pipeline that ingests data from multiple sources,  transforms it, and sends it to a "stash" like Elasticsearch. Supports various  input, filter, and output plugins.

    '
  image: https://www.elastic.co/static/images/logstash-logo.png
  humanURL: https://www.elastic.co/logstash/
  baseURL: https://localhost:9600
  tags:
  - Data Pipeline
  - ETL
  - Data Processing
  - Log Collection
  properties:
  - type: Documentation
    url: https://www.elastic.co/guide/en/logstash/current/index.html
  - type: API Reference
    url: https://www.elastic.co/guide/en/logstash/current/monitoring-logstash.html
  - type: Plugins
    url: https://www.elastic.co/guide/en/logstash/current/input-plugins.html
  - type: Configuration
    url: https://www.elastic.co/guide/en/logstash/current/configuration.html
- name: Beats APIs
  description: 'Lightweight data shippers that send operational data to Elasticsearch.  Includes Filebeat, Metricbeat, Packetbeat, Heartbeat, and others for  different data collection purposes.

    '
  image: https://www.elastic.co/static/images/beats-logo.png
  humanURL: https://www.elastic.co/beats/
  baseURL: https://localhost:5066
  tags:
  - Data Collection
  - Monitoring
  - Logging
  - Metrics
  properties:
  - type: Documentation
    url: https://www.elastic.co/guide/en/beats/libbeat/current/index.html
  - type: Filebeat
    url: https://www.elastic.co/guide/en/beats/filebeat/current/index.html
  - type: Metricbeat
    url: https://www.elastic.co/guide/en/beats/metricbeat/current/index.html
  - type: API Reference
    url: https://www.elastic.co/guide/en/beats/filebeat/current/exported-fields.html
- name: Elastic Cloud API
  description: 'Managed Elasticsearch and Kibana service available on AWS, GCP, and Azure.  Provides APIs for managing deployments, snapshots, and security.

    '
  humanURL: https://www.elastic.co/cloud/
  baseURL: https://api.elastic-cloud.com
  tags:
  - Cloud
  - Managed Service
  - Infrastructure
  properties:
  - type: Documentation
    url: https://www.elastic.co/guide/en/cloud/current/index.html
  - type: API Reference
    url: https://www.elastic.co/guide/en/cloud/current/ec-api-reference.html
  - type: OpenAPI
    url: https://www.elastic.co/guide/en/cloud/current/ec-restful-api.html
