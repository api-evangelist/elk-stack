- aid: elk-stack:kibana-api
  name: Kibana API
  description: >-
    The Kibana APIs expose the visualization, alerting, cases, Fleet,
    machine learning, Elastic Security and Elastic Observability surfaces
    that sit on top of Elasticsearch — 531 paths and 731 operations,
    including the Agent Builder MCP endpoint that turns a Kibana deployment
    into an MCP server. Elastic publishes it as OpenAPI 3.0.3 from the
    kibana repository.
  humanURL: https://www.elastic.co/docs/api/doc/kibana/
