source: >-
  Elastic's published client-library documentation
  (https://www.elastic.co/docs/reference/elasticsearch/clients) plus the
  elastic/* GitHub organization, with every version and release date read
  live from the package registry metadata endpoint named in each entry on
  2026-08-27.
note: >-
  Elastic maintains first-party Elasticsearch clients in eight languages and
  ships them in lockstep with the Elasticsearch minor version, which is why
  the majority of these read 9.5.x published within the last month. Two
  entries are the exceptions worth reading as decay signals: the Rust client
  has not left alpha since 2025-08 and Elastic labels it experimental, and
  @elastic/mcp-server-elasticsearch is frozen at 0.3.1 (2025-07-01) because
  Elastic deprecated the npm distribution in favour of a Docker image and,
  from Elastic 9.2.0, the Agent Builder MCP endpoint built into Kibana.
